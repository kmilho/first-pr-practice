.empty { color: var(--muted); margin: 6px 0; }
.link { border: 0; background: none; color: var(--s4); font-weight: 800; padding: 4px; }

/* 인사 배너 */
.hello { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 18px; padding: 22px 26px; border-radius: 28px; background: linear-gradient(120deg, var(--cs), #fff 85%); box-shadow: 0 5px 0 var(--line); overflow: hidden; }
.hello::after { content: ""; position: absolute; right: -30px; top: -40px; width: 180px; height: 180px; border-radius: 50%; background: var(--cs); opacity: .6; }
.hello-pet { position: relative; z-index: 1; display: grid; place-items: center; width: 84px; height: 84px; border-radius: 28px; background: #fff; font-size: 3rem; box-shadow: 0 5px 0 rgba(45, 50, 80, .08); animation: bob 2.6s ease-in-out infinite; }
.hello-text { position: relative; z-index: 1; flex: 1; min-width: 220px; }
.hello-hi { margin: 0; font-size: 1.9rem; line-height: 1.2; }
.hello-sub { margin: 4px 0 0; color: var(--muted); }
.hello-sub b { color: var(--ink); }
.hello .btn { position: relative; z-index: 1; }

/* 요약 카드 */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.kpi { position: relative; background: var(--panel); border-radius: 24px; padding: 18px 20px; box-shadow: 0 5px 0 var(--line); min-height: 140px; overflow: hidden; }
.kpi-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 14px; background: var(--cs); font-size: 1.25rem; margin-bottom: 6px; }
.kpi-label { margin: 0; color: var(--muted); font-size: .9rem; font-weight: 700; }
.kpi-value { display: block; font-size: 2.2rem; line-height: 1.15; color: var(--ink); font-variant-numeric: tabular-nums; }
.kpi-value small { font-size: 1.1rem; margin-left: 2px; color: var(--muted); }
.kpi-sub { margin: 2px 0 0; font-size: .82rem; font-weight: 700; color: var(--muted); }
.spark { position: absolute; right: 16px; top: 20px; width: 110px; height: 40px; }
.spark-line { fill: none; stroke: var(--c); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.spark-area { fill: var(--c); opacity: .12; }
.spark-dot { fill: #fff; stroke: var(--c); stroke-width: 2.5; }

/* 단계 카드 */
.home-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px; background: var(--page); border-radius: 999px; }
.seg button { padding: 5px 14px; border: 0; border-radius: 999px; background: transparent; font-size: .95rem; color: var(--muted); }
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: 0 2px 0 var(--line); }
.scards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.scard { position: relative; text-align: left; background: var(--panel); border: 3px solid var(--cs); border-radius: 24px; padding: 0; overflow: hidden; box-shadow: 0 4px 0 var(--cs); transition: transform .15s; }
.scard:hover { transform: translateY(-3px) rotate(-.4deg); }
.scard-top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--cs); }
.scard-pet { font-size: 1.7rem; line-height: 1; }
.scard-mark { font: 1.4rem var(--display); flex: 1; }
.scard-main { display: flex; align-items: center; gap: 14px; padding: 14px; }
.scard-rows { flex: 1; min-width: 0; display: grid; gap: 1px; font-size: .85rem; color: var(--muted); }
.scard-rows p { margin: 0; }
.scard-rows b { color: var(--ink); font-variant-numeric: tabular-nums; }
.scard-title { font-size: 1.2rem; color: var(--ink) !important; }
.ring { width: 66px; height: 66px; flex: none; }
.ring-bg { fill: none; stroke: var(--cs); stroke-width: 8; }
.ring-fg { fill: none; stroke: var(--c); stroke-width: 8; stroke-linecap: round; }
.ring text { font: 15px var(--display); fill: var(--ink); }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .75rem; font-weight: 800; white-space: nowrap; background: #fff; }
.pill.gray { color: var(--muted); }
.pill.sun { color: #a06800; }
.pill.green { color: #1d7d60; }
.pill.stage { background: var(--cs); color: var(--ink); }

/* 글자판 */
.matrix { display: grid; grid-template-columns: 26px repeat(10, minmax(0, 1fr)); gap: 5px; }
.mx-h { display: grid; place-items: center; font: .95rem var(--display); color: var(--muted); }
.mx-cell { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 10px; font: 1rem var(--display); padding: 0; transition: transform .1s; }
.mx-cell.v0 { background: #f3f6fb; color: #b3bdd0; }
.mx-cell.v1 { background: var(--s2-soft); color: var(--ink); box-shadow: 0 2px 0 #f6dc94; }
.mx-cell.v2 { background: var(--s3-soft); color: var(--ink); box-shadow: 0 2px 0 #a9e6d2; }
.mx-cell:hover { transform: scale(1.12); }
.legend { display: flex; gap: 16px; margin-top: 12px; font-size: .82rem; color: var(--muted); }
.legend i { display: inline-block; width: 13px; height: 13px; border-radius: 5px; margin-right: 5px; vertical-align: -1px; }
.legend .v0 { background: #f3f6fb; border: 1px solid var(--line); } .legend .v1 { background: var(--s2-soft); } .legend .v2 { background: var(--s3-soft); }

/* 기록 목록 */
.history { list-style: none; margin: 0; padding: 0; }
.history li { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 2px dotted var(--line); font-size: .92rem; }
.history li:last-child { border-bottom: 0; }
.history time { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; }
.history b { min-width: 0; overflow-wrap: anywhere; font-family: var(--display); font-weight: 400; font-size: 1.05rem; }
.history-scroll { max-height: 440px; overflow-y: auto; padding-right: 6px; overscroll-behavior: contain; }
.btn.more { display: flex; justify-content: center; width: 100%; margin-top: 12px; }
.btn.more small { color: var(--muted); font-family: var(--font); font-weight: 700; }
.more-done { margin-top: 10px; text-align: center; }
.act-view { color: #1d7d60; font-weight: 700; } .act-add { color: #2a78cc; font-weight: 700; } .act-remove { color: #d65e4f; font-weight: 700; }

/* 레벨 지도(징검다리) */
.stones { position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; padding: 30px 18px 18px; background: linear-gradient(180deg, #d9f0ff, #eaf7ff); border-radius: 28px; box-shadow: 0 5px 0 var(--line); overflow: hidden; }
.stones::before { content: ""; position: absolute; left: 10%; right: 10%; top: 72px; border-top: 6px dotted #fff; }
.stones::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: radial-gradient(40px 14px at 20px 26px, #c6e6fb 98%, transparent) 0 0 / 80px 26px repeat-x; opacity: .8; }
.stone { position: relative; z-index: 1; display: grid; justify-items: center; gap: 6px; padding: 0; border: 0; background: none; min-width: 0; }
.stone-ball { position: relative; display: grid; place-items: center; width: 84px; height: 84px; border-radius: 50%;
  background: radial-gradient(closest-side, #fff 76%, transparent 77%), conic-gradient(var(--c) calc(var(--p) * 360deg), rgba(255, 255, 255, .7) 0);
  box-shadow: 0 6px 0 rgba(45, 50, 80, .1); transition: transform .2s; }
.stone:hover .stone-ball { transform: translateY(-4px); }
.stone-mark { font-size: 1.7rem; line-height: 1; }
.stone-star { position: absolute; top: -6px; right: -4px; font-size: 1.3rem; }
.stone-name { display: flex; align-items: center; gap: 5px; font: 1rem var(--display); text-align: center; word-break: keep-all; }
.stone-name i { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: #fff; font: .8rem var(--display); font-style: normal; flex: none; }
.stone-count { font-size: .75rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.stone.on .stone-ball { width: 100px; height: 100px; margin-top: -8px; background: radial-gradient(closest-side, var(--cs) 76%, transparent 77%), conic-gradient(var(--c) calc(var(--p) * 360deg), #fff 0); box-shadow: 0 8px 0 rgba(45, 50, 80, .14); animation: bob 2.4s ease-in-out infinite; }
.stone.on .stone-mark { font-size: 2.1rem; }
.here { position: absolute; top: -26px; z-index: 2; padding: 2px 10px; border-radius: 999px; background: var(--ink); color: #fff; font: .8rem var(--display); white-space: nowrap; }
.here::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -5px; border: 5px solid transparent; border-bottom: 0; border-top-color: var(--ink); }

/* 단계 화면 */
.stage-panel { border-top: 8px solid var(--c); }
.stage-head { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 16px; }
.stage-pet { display: grid; place-items: center; width: 68px; height: 68px; border-radius: 22px; background: var(--cs); font-size: 2.4rem; }
.stage-copy { flex: 1; min-width: 180px; }
.eyebrow { margin: 0; font-size: .8rem; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
.stage-title { font-size: 1.9rem !important; text-wrap: balance; }
.desc { margin: 2px 0 0; color: var(--muted); }
.meter { min-width: 170px; background: var(--cs); border-radius: 18px; padding: 10px 16px; }
.meter span { display: block; font-size: .78rem; color: var(--muted); font-weight: 700; }
.meter b { font: 1.6rem var(--display); font-variant-numeric: tabular-nums; }
.meter small { font-size: .95rem; color: var(--muted); }
.meter i { display: block; height: 10px; margin-top: 4px; border-radius: 10px; background: linear-gradient(90deg, var(--c) calc(var(--p) * 100%), #fff 0); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chip { min-width: 48px; min-height: 44px; padding: 4px 14px; border: 2px solid var(--line); background: var(--panel); border-radius: 16px; font-size: 1.2rem; box-shadow: 0 3px 0 var(--line); }
.chip.on { background: var(--c); border-color: var(--c); color: #fff; box-shadow: 0 3px 0 rgba(45, 50, 80, .22); }

/* 카드 타일 */
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.grid.g4, .grid.g0 { grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); }
.grid.g5 { grid-template-columns: 1fr; }
.tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 100px; padding: 10px; background: var(--panel); border: 3px solid var(--line); border-radius: 22px; box-shadow: 0 4px 0 var(--line); transition: transform .12s; }
.tile:hover { transform: translateY(-3px); border-color: var(--c); }
.tile:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.t-text { font-size: 2.5rem; line-height: 1.1; overflow-wrap: anywhere; }
.g4 .t-text, .g0 .t-text { font-size: 1.6rem; }
.g5 .tile { flex-direction: row; justify-content: flex-start; gap: 14px; min-height: 66px; padding: 10px 18px; text-align: left; }
.g5 .t-text { font-size: 1.35rem; }
.t-stage { font-size: .72rem; color: var(--muted); font-weight: 700; }
.tile.seen { background: var(--cs); border-color: var(--cs); box-shadow: 0 4px 0 rgba(45, 50, 80, .1); }
.tile.seen::after { content: "⭐"; position: absolute; top: -8px; right: -6px; font-size: 1.1rem; }

/* 단어 추가 */
.add { border: 3px dashed var(--cs); box-shadow: none; }
.add h2 { margin-bottom: 10px; }
.add-row { display: flex; flex-wrap: wrap; gap: 8px; }
.add-row input { flex: 1 1 160px; min-width: 0; padding: 10px 12px; border: 2px solid var(--line); border-radius: 14px; }
.add-row #addEmoji { flex: 0 0 76px; text-align: center; }
.add-err { margin: 8px 0 0; color: #d65e4f; font-weight: 700; }
.mine { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; padding: 0; }
.mine li { display: flex; align-items: center; gap: 6px; background: var(--cs); border-radius: 999px; padding: 4px 6px 4px 12px; }
.mine button { border: 0; background: var(--panel); border-radius: 50%; width: 26px; height: 26px; font-size: .8rem; }

/* 학습 기록부 */
.record-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; }
.profile-card { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.profile-card > div:nth-child(2) { flex: 1; min-width: 160px; }
.profile-card small { font: .95rem var(--font); color: var(--muted); font-weight: 700; }
.sums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.sums div { background: var(--cs); border-radius: 18px; padding: 12px 8px; text-align: center; }
.sums span { display: block; font-size: .78rem; color: var(--muted); font-weight: 700; }
.sums b { font: 1.5rem var(--display); font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 11px 12px; border-bottom: 2px dotted var(--line); white-space: nowrap; }
th { font-size: .82rem; color: var(--muted); font-weight: 700; }
td:first-child { font-family: var(--display); font-size: 1.05rem; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 8px; }
.mini-bar { display: inline-block; width: 80px; height: 8px; margin-right: 8px; border-radius: 8px; background: var(--cs); vertical-align: middle; overflow: hidden; }
.mini-bar i { display: block; height: 100%; width: calc(var(--p) * 100%); background: var(--c); border-radius: 8px; }

/* 학습 분석 (기능 11) */
.fc-top { display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(2, minmax(0, 1fr)); gap: 12px; }
.fc-hero, .fc-stat { display: grid; gap: 2px; align-content: center; padding: 16px 18px; border-radius: 22px; background: var(--cs); min-width: 0; }
.fc-hero { background: linear-gradient(120deg, var(--cs), #fff); border: 3px solid var(--cs); }
.fc-label, .fc-stat span { font-size: .85rem; font-weight: 700; color: var(--muted); }
.fc-date { font: 2rem/1.2 var(--display); font-variant-numeric: tabular-nums; }
.fc-date small, .scenarios small, .fc-stat small { margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--ink); color: #fff; font: .8rem var(--font); font-weight: 800; vertical-align: middle; }
.fc-stat small { background: none; color: var(--muted); padding: 0; margin-left: 2px; font-size: 1rem; }
.fc-stat b { font: 1.5rem var(--display); font-variant-numeric: tabular-nums; }
.fc-sub { font-size: .85rem; color: var(--muted); }
.fc-warn { margin: 12px 0 0; padding: 10px 14px; border-radius: 14px; background: var(--s1-soft); color: #c2483a; font-weight: 700; }
.fc-body { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; margin-top: 18px; }
.fc-h { margin: 0 0 8px; font: 1rem var(--display); }
.bar-chart { display: block; width: 100%; height: auto; }
.bc-grid { stroke: var(--line); stroke-width: 1; }
.bc-tick, .bc-x { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.bc-bar { fill: var(--s4-soft); }
.bc-bar.recent { fill: var(--s4); }
.bc-hit { fill: transparent; }
.bc-col:hover .bc-hit { fill: rgba(61, 155, 255, .08); }
.bc-avg { stroke: var(--s1); stroke-width: 2; stroke-dasharray: 5 4; }
.fc-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
.bc-legend { display: inline-flex; align-items: center; gap: 6px; font: .78rem var(--font); font-weight: 700; color: var(--muted); }
.bc-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; }
.lg-recent { background: var(--s4); }
.lg-avg { height: 0 !important; width: 16px !important; border-top: 2px dashed var(--s1); border-radius: 0 !important; margin-left: 6px; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.timeline li { display: grid; grid-template-columns: 30px minmax(0, 1fr) 70px 74px 96px; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 14px; background: var(--page); font-size: .88rem; }
.tl-dot { font-size: 1.2rem; }
.tl-name { font-family: var(--display); font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timeline .mini-bar { width: 100%; margin: 0; }
.tl-left { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.tl-date { text-align: right; font-variant-numeric: tabular-nums; }
.scenarios { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.scenarios div { padding: 10px 12px; border: 2px dashed var(--line); border-radius: 16px; font-variant-numeric: tabular-nums; }
.scenarios span { display: block; font-size: .82rem; color: var(--muted); }
.scenarios span b { color: var(--ink); }
.fc-note { margin: 14px 0 0; font-size: .8rem; color: var(--muted); }

/* 오늘의 게임 */
.game-item .sub-no { background: var(--s1); color: #fff; }
.game-item .sub-name { font-weight: 400; }
.game-stage { position: relative; border-radius: 22px; overflow: hidden; border: 4px solid var(--ink); box-shadow: 0 6px 0 rgba(45, 50, 80, .2); background: #eef8ff; }
#gameCanvas { display: block; width: 100%; height: auto; aspect-ratio: 960 / 400; max-width: 100%; touch-action: manipulation; cursor: pointer; }
.g-hud { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; pointer-events: none; }
.g-hearts { font-size: 1.6rem; letter-spacing: 2px; filter: drop-shadow(0 2px 0 rgba(45, 50, 80, .2)); }
.g-pill { padding: 3px 12px; border-radius: 999px; background: rgba(255, 255, 255, .9); font: 1rem var(--display); box-shadow: 0 2px 0 rgba(45, 50, 80, .12); font-variant-numeric: tabular-nums; }
.g-overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 50px 12px 12px; background: rgba(45, 50, 80, .25); }
.g-card { width: min(460px, 100%); max-height: 100%; overflow: auto; background: #fff; border-radius: 26px; padding: 18px 20px; text-align: center; box-shadow: 0 6px 0 rgba(45, 50, 80, .25); animation: pop .25s cubic-bezier(.3, 1.4, .5, 1); }
.g-card h3 { margin: 4px 0 8px; font: 1.5rem var(--display); }
.g-big { font-size: 3rem; line-height: 1; }
.g-how { margin: 0 0 14px; padding: 0; list-style: none; display: grid; gap: 6px; text-align: left; }
.g-how li { padding: 8px 12px; border-radius: 14px; background: var(--page); }
.g-tip { margin: 8px 0 0; color: var(--muted); font-size: .88rem; }
.btn.go { background: var(--s3); border-color: var(--s3); box-shadow: 0 4px 0 #23977a; }
.g-box { border-top: 10px solid var(--c); background: linear-gradient(180deg, var(--cs), #fff 60%); }
.g-tag { display: inline-block; margin: 0; padding: 2px 12px; border-radius: 999px; background: var(--s2); color: #fff; font: 1rem var(--display); }
.g-word { margin: 6px 0 2px; font: 3.6rem/1.15 var(--display); text-shadow: 4px 4px 0 var(--cs); word-break: keep-all; }
.g-word.long { font-size: 1.9rem; }
.g-ask { margin: 0 0 12px; color: var(--muted); font-weight: 700; }
.g-choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.g-choice { position: relative; aspect-ratio: 1; max-width: 100%; border: 3px solid var(--line); border-radius: 22px; background: #fff; font-size: 3rem; line-height: 1; box-shadow: 0 5px 0 var(--line); transition: transform .1s; }
.g-choice:hover { transform: translateY(-3px); border-color: var(--c); }
.g-choice:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.g-choice small { position: absolute; top: 6px; left: 10px; font: .8rem var(--font); font-weight: 800; color: var(--muted); }
.g-result.ok h3 { color: #1d7d60; }
.g-result.ng h3 { color: #c2483a; }
.g-answer { display: inline-flex; align-items: center; gap: 10px; margin: 4px 0 0; padding: 6px 18px; border-radius: 999px; background: var(--page); }
.g-answer span { font-size: 2.2rem; }
.g-answer b { font: 1.8rem var(--display); font-weight: 400; }
.g-stars { margin: 0; font-size: 2rem; letter-spacing: 4px; color: var(--s2); }
.game-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 14px; }
.btn.jump { background: var(--s4); border-color: var(--s4); font-size: 1.3rem; padding: 12px 28px; box-shadow: 0 5px 0 #2a78cc; }
@media (max-width: 1300px) {
  .g-overlay { position: static; padding: 14px; background: var(--page); border-top: 4px solid var(--ink); }
  .g-overlay .g-card { box-shadow: 0 4px 0 var(--line); }
}
.weak-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.weak-list li { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: var(--cs); }
.weak-list b { font: 1.15rem var(--display); font-weight: 400; }
.weak-list span { font-size: .8rem; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.game-log { margin-top: 12px; }

/* 카드 · 대화상자 */
.modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(45, 50, 80, .45); }
.sheet { position: relative; width: min(520px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border-radius: 32px; padding: 26px 22px 18px; text-align: center; animation: pop .25s cubic-bezier(.3, 1.4, .5, 1); box-shadow: 0 8px 0 rgba(45, 50, 80, .25); }
.card-sheet { border-top: 12px solid var(--c); background: linear-gradient(180deg, var(--cs), #fff 45%); }
.sheet.dialog { text-align: left; width: min(460px, 100%); }
.sheet.dialog h2 { margin: 0 0 14px; font-size: 1.35rem; }
.close { position: absolute; top: 12px; right: 12px; width: 42px; height: 42px; border: 0; border-radius: 50%; background: #fff; font-size: 1.05rem; box-shadow: 0 2px 0 var(--line); }
.sheet-tag { display: inline-block; margin: 0; padding: 4px 14px; border-radius: 999px; background: #fff; font: .95rem var(--display); }
.glyph { font-size: 8.5rem; line-height: 1.05; margin-top: 8px; word-break: keep-all; color: var(--ink); text-shadow: 5px 5px 0 var(--cs); }
.s4 .glyph { font-size: 4.4rem; }
.s5 .glyph { font-size: 2.2rem; line-height: 1.35; text-shadow: 3px 3px 0 var(--cs); }
.glyph-name { margin: 0; font: 1.5rem var(--display); color: var(--muted); }
.formula { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 12px 0 0; font: 1.8rem var(--display); }
.formula span { min-width: 56px; padding: 4px 12px; border-radius: 16px; background: #fff; box-shadow: 0 3px 0 var(--line); }
.formula .res { background: var(--c); color: #fff; box-shadow: 0 3px 0 rgba(45, 50, 80, .2); }
.formula em { font-style: normal; color: var(--muted); }
.pieces { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
.pieces span { padding: 4px 14px; border-radius: 14px; background: #fff; font: 1.35rem var(--display); box-shadow: 0 3px 0 var(--line); }
.reward { min-height: 116px; display: grid; place-items: center; align-content: center; gap: 4px; margin-top: 14px; }
.mystery { display: grid; place-items: center; gap: 4px; width: 100%; padding: 14px; border: 3px dashed var(--cs); border-radius: 22px; background: #fff; color: var(--muted); }
.mystery-q { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--cs); color: var(--ink); font: 2rem var(--display); animation: wiggle 1.6s ease-in-out infinite; }
.mystery span:last-child { font-size: .9rem; font-weight: 700; }
.reveal { animation: reveal .5s cubic-bezier(.3, 1.7, .5, 1); }
.big-emoji { font-size: 4.6rem; line-height: 1.1; }
.example { display: inline-flex; align-items: center; gap: 10px; padding: 8px 20px; border-radius: 999px; background: #fff; box-shadow: 0 3px 0 var(--line); }
.ex-emoji { font-size: 2.3rem; }
.ex-word { font: 1.7rem var(--display); }
.ex-word b { color: var(--s1); font-weight: 400; }
.cheer { margin: 0; font: 1.15rem var(--display); color: #1d7d60; }
.listen { margin-top: 4px; padding: 6px 16px; border: 2px solid var(--cs); border-radius: 999px; background: #fff; font: 1rem var(--display); box-shadow: 0 3px 0 var(--cs); }
.listen:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--cs); }
.sheet-nav { display: grid; grid-template-columns: 60px 1fr 60px; gap: 10px; margin-top: 16px; }
.sheet-nav button { min-height: 62px; border: 3px solid var(--line); border-radius: 20px; background: #fff; font-size: 1.2rem; box-shadow: 0 4px 0 var(--line); }
.sheet-nav button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.sheet-nav button:disabled { opacity: .3; cursor: default; }
.sheet-nav .primary { background: var(--s3); border-color: var(--s3); color: #fff; font-size: 1.6rem; box-shadow: 0 5px 0 #23977a; }
.sheet-nav .primary.next { background: var(--s4); border-color: var(--s4); box-shadow: 0 5px 0 #2a78cc; }
.count { margin: 12px 0 0; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.radio-row { display: flex; gap: 16px; margin-bottom: 12px; font-weight: 700; }
.form-grid { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; }
.form-grid h2 { grid-column: 1 / -1; }
.form-grid input { padding: 9px 12px; border: 2px solid var(--line); border-radius: 14px; min-width: 0; }
.dialog-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

.toast { position: fixed; z-index: 40; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px; font: 1.05rem var(--display); box-shadow: 0 5px 0 rgba(45, 50, 80, .25); }

@keyframes pop { from { transform: scale(.9); opacity: .4; } to { transform: scale(1); opacity: 1; } }
@keyframes reveal { from { transform: scale(.2) rotate(-12deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }

@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .home-grid, .record-grid, .fc-body { grid-template-columns: minmax(0, 1fr); }
  .fc-top { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fc-hero { grid-column: 1 / -1; }
}
@media (max-width: 560px) {
  .fc-top, .scenarios { grid-template-columns: minmax(0, 1fr); }
  .timeline li { grid-template-columns: 26px minmax(0, 1fr) 90px; }
  .timeline .mini-bar, .tl-left { display: none; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px max(16px, env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 3px solid var(--line); }
  .brand { padding: 0 8px 0 0; font-size: 1.2rem; }
  .logo { width: 36px; height: 36px; font-size: 1.3rem; }
  .nav { display: flex; gap: 4px; overflow-x: auto; max-width: 100%; }
  .nav-item { padding: 6px 10px; font-size: 1rem; white-space: nowrap; }
  .nav-icon { width: 28px; height: 28px; }
  .subnav, .side-foot { display: none; }
  .bar { position: static; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .bar h1 { width: 100%; }
  #search { width: 100%; }
  .tools { width: 100%; }
  .view { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .hello { padding: 18px; }
  .hello-pet { width: 64px; height: 64px; font-size: 2.3rem; }
  .hello-hi { font-size: 1.5rem; }
  .kpis { gap: 10px; }
  .kpi { min-height: 128px; padding: 14px; }
  .kpi-value { font-size: 1.7rem; }
  .spark { width: 64px; height: 28px; right: 10px; top: 14px; }
  .sums { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stones { padding: 28px 8px 16px; gap: 2px; }
  .stones::before { top: 56px; }
  .stone-ball { width: 54px; height: 54px; }
  .stone.on .stone-ball { width: 64px; height: 64px; }
  .stone-mark { font-size: 1.1rem; }
  .stone.on .stone-mark { font-size: 1.35rem; }
  .stone-name { font-size: .74rem; flex-direction: column; gap: 2px; }
  .here { font-size: .68rem; padding: 1px 6px; top: -24px; }
  .glyph { font-size: 6.5rem; }
  .s4 .glyph { font-size: 3.3rem; }
  .s5 .glyph { font-size: 1.7rem; }
  .mx-cell { font-size: .82rem; border-radius: 7px; }
  .g-word { font-size: 2.6rem; }
  .g-choice { font-size: 2.3rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ===== Rev.2: 동화책 · 징검다리 모험 · 더보기 메뉴 · 터치 크기 ===== */
.btn { min-height: 44px; }
.btn[disabled], .seg button[disabled] { opacity: .45; cursor: not-allowed; }
.btn.icon { font-size: 1.25rem; }
.spark { overflow: visible; }
.moretog { display: none; }
.bk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-top: 8px; }
.bk-card { display: grid; justify-items: center; gap: 6px; padding: 18px 12px; border: 3px solid var(--cs); border-radius: 24px; background: var(--cs); cursor: pointer; text-align: center; box-shadow: 0 5px 0 var(--c); font-family: var(--display); font-size: 1.2rem; }
.bk-card small { font-family: var(--font); font-weight: 700; color: var(--muted); font-size: .85rem; }
.bk-card:active { transform: translateY(2px); box-shadow: 0 3px 0 var(--c); }
.bk-cover { font-size: 3.4rem; line-height: 1.1; }
.bk-bar { width: 100%; height: 10px; border-radius: 99px; background: #fff; overflow: hidden; }
.bk-bar i { display: block; height: 100%; background: var(--c); border-radius: 99px; }
.book-panel .panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.book-panel .panel-head h2 { margin: 0 auto 0 0; }
.bk-pic { text-align: center; font-size: clamp(5rem, 16vw, 9rem); line-height: 1.15; margin: 8px 0; }
.bk-text { text-align: center; margin: 6px 0 14px; line-height: 1.5; }
.bk-w { font: clamp(1.7rem, 6vw, 2.8rem) var(--display); padding: 4px 12px; margin: 3px; border: 3px solid transparent; border-radius: 16px; background: var(--cs); color: var(--ink); cursor: pointer; }
.bk-w.now { background: var(--c); color: #fff; transform: scale(1.08); }
.bk-mode { display: flex; justify-content: center; margin-bottom: 12px; }
.bk-ctl { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 8px; }
.adv-panel { margin-top: 14px; }
.adv-card { background: #fff; border: 3px solid var(--line); border-radius: 24px; padding: 16px 18px; text-align: center; box-shadow: 0 5px 0 var(--line); min-height: 120px; }
.adv-card h3 { margin: 4px 0 6px; font: 1.5rem var(--display); }
.adv-card .g-how { max-width: 560px; margin: 8px auto 14px; }
.adv-card.ok { border-color: var(--s3); background: var(--s3-soft); }
.adv-card.ng { border-color: var(--s1); background: var(--s1-soft); }
.r2-choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 12px; }
.r2-choice, .r2-chip { position: relative; min-width: 96px; min-height: 64px; padding: 8px 18px; border: 3px solid var(--s4); border-radius: 18px; background: var(--s4-soft); font: clamp(1.4rem, 5vw, 2.2rem) var(--display); color: var(--ink); cursor: pointer; box-shadow: 0 4px 0 var(--s4); }
.r2-choice small { position: absolute; top: 2px; left: 8px; font: .7rem var(--font); color: var(--muted); }
.r2-chip { border-color: var(--s5); background: var(--s5-soft); box-shadow: 0 4px 0 var(--s5); }
.r2-chip[disabled] { visibility: hidden; }
.r2-choice:active, .r2-chip:active { transform: translateY(2px); }
.r2-word { font: clamp(2.4rem, 9vw, 3.6rem) var(--display); letter-spacing: .1em; margin: 4px 0 8px; }
.blank { display: inline-block; min-width: 1.1em; border-bottom: 5px solid var(--s2); color: var(--s2); }
.r2-built { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 52px; margin: 6px 0; }
.r2-slot { padding: 4px 14px; border-radius: 14px; border: 3px dashed var(--line); font: 1.6rem var(--display); color: var(--muted); }
.r2-slot.on { border: 3px solid var(--s3); background: var(--s3-soft); color: var(--ink); }
#advCanvas { display: block; width: 100%; height: auto; aspect-ratio: 960 / 400; max-width: 100%; touch-action: manipulation; cursor: pointer; }
@media (max-width: 760px) {
  .moretog { display: inline-flex; }
  .tools:not(.open) .x { display: none; }
  .tools.open .x { display: inline-flex; }
  .btn.big { padding: 12px 18px; }
}
@media (max-width: 560px) {
  #advHud { top: 6px; left: 8px; right: 8px; gap: 5px; }
  #advHud .g-hearts { font-size: 1rem; letter-spacing: 0; }
  #advHud .g-pill { padding: 1px 8px; font-size: .82rem; }
  #advHud .g-pill:last-child { display: none; }
}
</style>
