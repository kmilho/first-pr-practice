<!--
  프로젝트명: 한글 징검다리 (Rev.1)
  개요: 자음·모음부터 글자 합치기, 받침, 단어, 문장까지 5단계로 익히는 유치원생 한글 학습 앱.
        html 파일 하나로 동작하며 학습 데이터는 외부로 보내지 않는다. 데이터는 아이 1명의 "학습 기록부"로 관리한다.
  핵심 기능: F-01 5단계 학습 콘텐츠, F-02 발음 듣기, F-03 터치 따라 쓰기, F-04 퀴즈·숙련도 판정,
            F-05 오답 반복, F-06 단계 연결, F-07 혼자 15분, F-08 함께 하기, F-09 출석 체크,
            F-10 진도 대시보드, F-11 한글 떼기 예상일, F-12 현재 단계 표시, F-13 칭찬 스티커,
            F-14 학습 기록부 저장·JSON 내보내기·불러오기
  구현 현황: F-01, F-02, F-04, F-05, F-11, F-14 구현. F-04·F-05는 "오늘의 게임!"(점프 퀴즈 게임)으로 구현. 나머지는 순서대로 추가 예정.
  Rev.2 변경: 대윤이 빈 기록으로 시작, 왼쪽 메뉴에 📖 동화책 · 🗺️ 징검다리 모험 추가, 폰에서 도구줄을 ⋯ 더보기로 접음, 버튼 터치 크기 확대.
        동화책: 문장이 이어진 5권(6쪽씩), 단어 누르면 소리, 혼자/같이 읽기. 징검다리 모험: 블록·다리·친구 구출로 단어→문장 읽기. Rev.1 점프 게임은 그대로 유지.
  Rev.1 변경: 유치원생용 디자인(단계별 색·병아리 성장 표시·레벨 지도형 징검다리), 왼쪽 메뉴에 1~5단계 하위 메뉴 추가.
-->

  </div>
</div>

// 4단계는 받침 유무로 4.1 / 4.2, 5단계는 20개씩 묶음
const WORD_GROUPS = ['받침 없는 단어', '받침 있는 단어'];
const SENT_CHUNK = 20;
const hasBatchim = w => [...w].some(ch => { const n = ch.charCodeAt(0) - 0xAC00; return n >= 0 && n < 11172 && n % 28 !== 0; });
const chunkLabel = i => (Math.floor(i / SENT_CHUNK) * SENT_CHUNK + 1) + '~' + (Math.floor(i / SENT_CHUNK) + 1) * SENT_CHUNK;
// 단계가 오를수록 병아리가 자란다 (🥚 → 🐔)
const STAGES = [
  { no: 1, name: '자음·모음', mark: 'ㄱㅏ', pet: '🥚', desc: '글자를 만드는 소리 조각을 만나요' },

  { no: 4, name: '단어', mark: '나무', pet: '🐤', desc: '글자를 이어서 단어를 읽어요' },
  { no: 5, name: '문장', mark: '문장', pet: '🐔', desc: '단어를 이어서 문장을 읽어요' }
];

// 단계별 학습 항목 만들기 (2단계는 조합 공식으로 생성, 4·5단계는 기본 + 부모가 추가한 항목)
function buildItems(no) {
  const item = (text, o) => Object.assign({ id: 's' + no + ':' + text, stage: no, text }, o);
  if (no === 1) return [
    ...CONSONANTS.map(([t, label, w, e]) => item(t, { group: '자음', label, example: [w, e] })),
    ...VOWELS.map(([t, label, w, e]) => item(t, { group: '모음', label, example: [w, e] }))
  ];
  if (no === 2) return CONSONANTS.flatMap(([c]) => VOWELS.map(([v]) => {
    const t = compose(c, v);
    return item(t, { group: c, parts: [c, v], example: SYLLABLE_WORDS[t] || null });
  }));
  if (no === 3) return Object.entries(BATCHIM).flatMap(([b, list]) => list.map(([t, w, e]) => {
    const [c, v] = decompose(t);
    return item(t, { group: b, parts: [compose(c, v), b], example: [w, e] });
  }));
  const base = (no === 4 ? WORDS : SENTENCES).map(([t, e]) => item(t, { example: [null, e] }));
  const added = state.custom[no].map(c => item(c.text, { example: [null, c.emoji], custom: true }));
  return base.concat(added).map((it, i) => Object.assign(it, {
    parts: no === 4 ? [...it.text] : it.text.split(' '),
    group: no === 4 ? WORD_GROUPS[hasBatchim(it.text) ? 1 : 0] : chunkLabel(i)
  }));
}

function groupsOf(no) {
  if (no === 1) return ['자음', '모음'];
  if (no === 2) return CONSONANTS.map(c => c[0]);
  if (no === 3) return Object.keys(BATCHIM);
  if (no === 4) return WORD_GROUPS;
  const n = SENTENCES.length + state.custom[5].length;
  return Array.from({ length: Math.ceil(n / SENT_CHUNK) }, (_, k) => chunkLabel(k * SENT_CHUNK));
}

function groupLabel(no, g) {
  if (no === 3) return g + ' 받침';
  if (no === 4) return '4.' + (WORD_GROUPS.indexOf(g) + 1) + ' ' + g;
  return g;
}

function groupCount(no, g) {
  const all = buildItems(no).filter(it => it.group === g);
  return { seen: all.filter(it => state.items[it.id]).length, total: all.length };
}

function currentGroup(no) {
  const gs = groupsOf(no);
  if (!gs.length) return null;
  return gs.includes(state.ui.filter[no]) ? state.ui.filter[no] : gs[0];
}

function visibleItems(no) {
  const g = currentGroup(no);
  const all = buildItems(no);
  return g ? all.filter(it => it.group === g) : all;
}

function stageCount(no) {
  const all = buildItems(no);
  const read = all.filter(it => state.items[it.id]);
  const last = read.map(it => state.items[it.id].lastSeen).sort().pop() || '';
  return { seen: read.length, total: all.length, last };
}

// 다 읽은 카드 기록: 글자별 성적(items)과 학습 히스토리(history)에 함께 남긴다
function recordView(id) {
  const prev = state.items[id] || { views: 0 };
  state.items[id] = Object.assign(prev, { views: prev.views + 1, lastSeen: today() });
  state.history.push({ t: nowStamp(), type: 'view', id });
  if (state.history.length > HISTORY_MAX) state.history.splice(0, state.history.length - HISTORY_MAX);
  saveState();
}

// 부모가 4단계 단어·5단계 문장 추가
function addCustom(no, text, emoji) {
  text = text.trim().replace(/\s+/g, ' ');
  if (no === 4 && !/^[가-힣]{1,8}$/.test(text)) return '단어는 한글 1~8글자로 적어 주세요.';
  if (no === 5 && !(/[가-힣]/.test(text) && text.length >= 2 && text.length <= 40)) return '문장은 한글로 2~40자 안에서 적어 주세요.';
  if (buildItems(no).some(it => it.text === text)) return '이미 있는 ' + (no === 4 ? '단어' : '문장') + '예요.';
  state.custom[no].push({ text, emoji: emoji.trim() || (no === 4 ? '📝' : '💬') });
  state.history.push({ t: nowStamp(), type: 'add', id: 's' + no + ':' + text });
  saveState();
  return null;
}

function removeCustom(no, text) {
  state.custom[no] = state.custom[no].filter(c => c.text !== text);
  state.history.push({ t: nowStamp(), type: 'remove', id: 's' + no + ':' + text });
  saveState();
}

// 전체 단계에서 글자·단어·문장 찾기
function searchItems(q) {
  q = q.trim();
  if (!q) return [];
  return STAGES.flatMap(st => buildItems(st.no)).filter(it =>
    it.text.includes(q) || (it.label && it.label.includes(q)) || (it.example && it.example[0] && it.example[0].includes(q)));
}

/* ===== 기능 2 (F-02) 발음 듣기 ===== */
// 브라우저 내장 음성 합성(Web Speech API, ko-KR). 음성 파일·네트워크 호출 없음
let koVoice = null;
let speakToken = 0;
function pickVoice() {
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  koVoice = vs.find(v => /^ko/i.test(v.lang)) || null;
  return vs.length;
}
if (window.speechSynthesis) {
  pickVoice();
  speechSynthesis.addEventListener('voiceschanged', pickVoice);
}

// 자음·모음은 이름으로(ㄱ → 기역), 나머지는 글자 그대로 읽는다
const speechText = it => it.stage === 1 ? it.label : it.text;

function speak(it, onDone) {
  if (!window.speechSynthesis) { toast('🔇 이 브라우저는 소리 읽기를 지원하지 않아요.'); return false; }
  const token = ++speakToken;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(speechText(it));
  u.lang = 'ko-KR';
  if (koVoice) u.voice = koVoice;
  u.rate = it.stage === 5 ? 0.85 : 0.75;
  u.pitch = 1.1;
  if (onDone) u.onend = () => { if (token === speakToken) onDone(); };
  speechSynthesis.speak(u);
  if (pickVoice() && !koVoice) toast('🔇 이 기기에 한국어 음성이 없어 소리가 안 날 수 있어요.');
  return true;
}

function stopSpeak() {
  speakToken++;
  if (window.speechSynthesis) speechSynthesis.cancel();
}

/* ===== 기능 4 (F-04) 퀴즈 결과와 숙련도 판정 ===== */
// 기획서 기준 — 숙련: 최근 3번 중 2번 이상 정답 / 약점: 누적 오답 2번 이상이면서 아직 숙련 전
const GAME_LOG_MAX = 200;

function recordQuiz(id, ok) {
  const q = state.quiz[id] || (state.quiz[id] = { r: 0, w: 0, recent: [] });
  if (ok) q.r++; else q.w++;
  q.recent = q.recent.concat(ok ? 1 : 0).slice(-10);
  // 맞히면 읽은 카드로도 센다
  if (ok) {
    const it = state.items[id] || { views: 0 };
    state.items[id] = Object.assign(it, { views: it.views + 1, lastSeen: today() });
  }
  state.history.push({ t: nowStamp(), type: 'quiz', id, ok });
  if (state.history.length > HISTORY_MAX) state.history.splice(0, state.history.length - HISTORY_MAX);
  saveState();
}

function mastery(id) {
  const q = state.quiz[id];
  if (!q) return 'new';
  if (q.recent.slice(-3).reduce((a, b) => a + b, 0) >= 2) return 'mastered';
  return q.w >= 2 ? 'weak' : 'learning';
}

function quizSummary() {
  const ids = Object.keys(state.quiz);
  const byId = Object.fromEntries(STAGES.flatMap(st => buildItems(st.no)).map(it => [it.id, it]));
  const weak = ids.filter(id => byId[id] && mastery(id) === 'weak')
    .map(id => Object.assign({ q: state.quiz[id] }, byId[id]))
    .sort((a, b) => b.q.w - a.q.w);
  const right = ids.reduce((a, id) => a + state.quiz[id].r, 0);
  const wrong = ids.reduce((a, id) => a + state.quiz[id].w, 0);
  return { mastered: ids.filter(id => mastery(id) === 'mastered').length, weak, right, wrong };
}

/* ===== 기능 5 (F-05) 오답 반복: 약점 단어를 먼저 출제 ===== */
const GAME_LEVELS = [
  { key: 'easy', name: '쉬움', desc: '받침 없는 단어', stage: 4, group: WORD_GROUPS[0] },
  { key: 'normal', name: '보통', desc: '받침 있는 단어', stage: 4, group: WORD_GROUPS[1] },
  { key: 'hard', name: '어려움', desc: '짧은 문장', stage: 5, group: null }
];
const GAME_ROUND = 10;
const GAME_HEARTS = 3;
const shuffle = a => {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};

function levelPool(key) {
  const L = GAME_LEVELS.find(l => l.key === key);
  const all = buildItems(L.stage);
  return L.group ? all.filter(it => it.group === L.group) : all;
}

// 약점 → 연습 중 → 처음 푸는 것(읽은 카드 먼저) → 익힌 것 순서로 고르고, 같은 순위 안에서는 섞는다
function pickQuestions(key, n) {
  const pool = levelPool(key);
  const rank = { weak: 0, learning: 1, new: 2, mastered: 3 };
  const picked = shuffle(pool)
    .sort((a, b) => rank[mastery(a.id)] - rank[mastery(b.id)] || (state.items[b.id] ? 1 : 0) - (state.items[a.id] ? 1 : 0))
    .slice(0, n);
  return shuffle(picked).map(it => ({
    it,
    choices: shuffle([it].concat(shuffle(pool.filter(o => o.example[1] !== it.example[1])).slice(0, 2)))
  }));
}

/* ===== 기능 11 (F-11) 한글 떼기 예상일 ===== */
// 기획서 기준: 예상일 = 남은 학습 항목 ÷ 최근 7일 하루 평균(달력 기준), 한글 떼기 = 1~4단계 완료 + 5단계 80%
// 숙련 판정(기능 4) 전이므로 지금은 "처음 읽은 카드"를 익힌 항목으로 센다
const READY_RATIO = 0.8;
const PACE_DAYS = 7;

function forecast() {
  const t = today();
  const days = [];
  for (let i = 13; i >= 0; i--) days.push(addDays(t, -i));
  const first = {};
  state.history.forEach(h => {
    if ((h.type === 'view' || (h.type === 'quiz' && h.ok)) && state.items[h.id] && !first[h.id]) first[h.id] = h.t.slice(0, 10);
  });
  const newPerDay = days.map(d => Object.values(first).filter(f => f === d).length);
  const pace = newPerDay.slice(-PACE_DAYS).reduce((a, b) => a + b, 0) / PACE_DAYS;
  const stages = STAGES.map(st => Object.assign({ st }, stageCount(st.no)));
  stages.forEach(s => { s.remain = s.total - s.seen; });
  const dateAfter = (n, p) => p > 0 ? addDays(t, Math.ceil(n / p)) : null;
  // 단계 순서대로 학습한다고 보고, 각 단계가 끝나는 날을 누적 남은 양으로 계산
  let cum = 0;
  stages.forEach(s => { cum += s.remain; s.doneDate = s.remain === 0 ? 'done' : dateAfter(cum, pace); });
  const s5 = stages[4];
  const readyRemain = stages.slice(0, 4).reduce((a, s) => a + s.remain, 0) + Math.max(0, Math.ceil(s5.total * READY_RATIO) - s5.seen);
  const allRemain = stages.reduce((a, s) => a + s.remain, 0);
  return {
    days, newPerDay, pace, stages, readyRemain, allRemain,
    readyDate: readyRemain === 0 ? 'done' : dateAfter(readyRemain, pace),
    allDate: allRemain === 0 ? 'done' : dateAfter(allRemain, pace),
    studyDays7: days.slice(-PACE_DAYS).filter(d => state.history.some(h => h.type === 'view' && h.t.startsWith(d))).length,
    scenarios: [10, 20].map(p => ({ p, date: readyRemain === 0 ? 'done' : dateAfter(readyRemain, p) }))
  };
}

// 오늘부터 며칠 남았는지 (D-day)
function dday(d) {
  const [y, m, dd] = d.split('-').map(Number);
  const [ty, tm, td] = today().split('-').map(Number);
  return Math.round((new Date(y, m - 1, dd) - new Date(ty, tm - 1, td)) / 86400000);
}

/* ===== 기능 14 (F-14) 학습 기록부 저장 · JSON 내보내기 · 불러오기 ===== */
// 기록부 구조: learner(프로필) · items(글자별 성적) · history(학습 히스토리) · custom(추가 단어·문장)
// 이전 버전 파일과 저장 공간을 나눠서 서로 덮어쓰지 않게 한다 (처음 열 때만 이전 기록을 옮겨 온다)
const STORE_KEY = 'hangul-stepping-stones-rev2';
const OLD_STORE_KEY = 'hangul-stepping-stones-v1';
const APP_ID = 'hangul-stepping-stones';
const HISTORY_MAX = 5000;
const VIEWS = ['home', 'stage', 'game', 'record', 'book', 'adv'];
let state;
let storageOk = true;

function checkStorage() {
  try {
    localStorage.setItem(STORE_KEY + '-test', '1');
    localStorage.removeItem(STORE_KEY + '-test');
  } catch (e) { storageOk = false; }
}

function normalize(d) {
  if (!d || typeof d !== 'object' || !d.items || typeof d.items !== 'object' || !Array.isArray(d.history))
    throw new Error('한글 징검다리 기록부 파일이 아니에요.');
  const items = {};
  for (const [k, v] of Object.entries(d.items))
    if (/^s[1-5]:./.test(k) && v && Number(v.views) > 0)
      items[k] = Object.assign({}, v, { views: Math.floor(Number(v.views)), lastSeen: String(v.lastSeen || '') });
  const cleanCustom = a => Array.isArray(a)
    ? a.filter(c => c && typeof c.text === 'string' && c.text.trim())
       .map(c => ({ text: c.text.trim().slice(0, 40), emoji: String(c.emoji || '📝').slice(0, 8) }))
    : [];
  const quiz = {};
  for (const [k, v] of Object.entries(d.quiz || {}))
    if (/^s[1-5]:./.test(k) && v) quiz[k] = {
      r: Math.max(0, Math.floor(Number(v.r) || 0)),
      w: Math.max(0, Math.floor(Number(v.w) || 0)),
      recent: Array.isArray(v.recent) ? v.recent.slice(-10).map(x => x ? 1 : 0) : []
    };
  const games = Array.isArray(d.games) ? d.games.filter(g => g && typeof g.t === 'string').slice(-GAME_LOG_MAX).map(g => ({
    t: g.t, level: String(g.level || 'easy'), score: Number(g.score) || 0, right: Number(g.right) || 0, wrong: Number(g.wrong) || 0, clear: !!g.clear
  })) : [];
  const L = d.learner || {};
  const U = d.ui || {};
  return {
    app: APP_ID,
    version: 2,
    savedAt: String(d.savedAt || ''),
    learner: {
      name: String(L.name || '하늘이').slice(0, 10),
      age: Math.min(9, Math.max(3, Number(L.age) || 6)),
      startDate: /^\d{4}-\d{2}-\d{2}$/.test(L.startDate) ? L.startDate : today()
    },
    items,
    history: d.history.filter(h => h && typeof h.t === 'string' && typeof h.type === 'string' && typeof h.id === 'string').slice(-HISTORY_MAX),
    custom: { 4: cleanCustom(d.custom && d.custom[4]), 5: cleanCustom(d.custom && d.custom[5]) },
    quiz,
    games,
    books: normBooks(d.books),
    adv: normAdv(d.adv),
    ui: {
      gameLevel: GAME_LEVELS.some(l => l.key === U.gameLevel) ? U.gameLevel : 'easy',
      view: VIEWS.includes(U.view) ? U.view : 'home',
      stage: [1, 2, 3, 4, 5].includes(U.stage) ? U.stage : 1,
      filter: Object.assign({}, U.filter),
      sort: ['no', 'most', 'least'].includes(U.sort) ? U.sort : 'no',
      homeFilter: ['all', 'doing', 'todo', 'done'].includes(U.homeFilter) ? U.homeFilter : 'all'
    }
  };
}

function loadState() {
  for (const key of [STORE_KEY]) {
    try {
      const raw = localStorage.getItem(key);
      if (raw) return normalize(JSON.parse(raw));
    } catch (e) { /* 저장소가 막혔거나 손상되면 다음 후보 → 예시 기록 */ }
  }
  return normalize(makeBlank());
}

// 변경할 때마다 자동 저장, 상단 [저장] 버튼으로 직접 저장
function saveState(manual) {
  state.savedAt = nowStamp();
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    storageOk = true;
    if (manual) toast('💾 ' + state.learner.name + ' 기록부를 저장했어요.');
  } catch (e) {
    storageOk = false;
    toast('⚠️ 이 화면에서는 브라우저 저장이 막혀 있어요. [내보내기]로 파일을 보관해 주세요.');
  }
  renderSaved();
}

// 같은 파일을 다른 창에서 저장하면, 이 창의 옛 기록으로 덮어쓰지 않도록 최신 기록을 다시 읽는다
function syncFromOtherWindow(e) {
  if (e.key !== STORE_KEY || !e.newValue) return;
  try {
    state = normalize(JSON.parse(e.newValue));
    renderAll();
    toast('🔄 다른 창에서 바뀐 기록을 불러왔어요.');
  } catch (err) { /* 손상된 값은 무시 */ }
}

function exportRecord() {
  const data = Object.assign({ exportedAt: nowStamp() }, state);
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '학습기록부_' + state.learner.name + '_' + today() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('📤 ' + state.learner.name + ' 기록부를 파일로 내보냈어요.');
}

function importRecord(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      state = normalize(JSON.parse(reader.result));
      saveState();
      renderAll();
      toast('📥 ' + state.learner.name + ' 기록부를 불러왔어요.');
    } catch (e) {
      toast(e instanceof SyntaxError ? 'JSON 형식이 올바르지 않아요.' : e.message);
    }
  };
  reader.readAsText(file);
}

function resetToSample() {
  state = normalize(makeSample());
  saveState();
  renderAll();
  toast('↺ 예시 기록으로 되돌렸어요.');
}

/* ===== 화면 그리기 ===== */

];

const tone = no => `--c:var(--s${no});--cs:var(--s${no}-soft)`;
let cardList = [];
let cardIdx = 0;
let cardRead = false;
let cardTimer = null;

// 왼쪽 메뉴: 단계 학습 아래에 1~5단계 바로가기

          const gOn = sOn && currentGroup(4) === g;
          return `<button class="sub-item sub2${gOn ? ' on' : ''}" data-act="stage" data-no="4" data-g="${g}" style="${tone(4)}">
            <span class="sub-no">4.${gi + 1}</span><span class="sub-name">${g}</span><span class="sub-count">${gk.seen}/${gk.total}</span></button>`;
        }).join('') : '');

        <span class="sub-no">6</span><span class="sub-name">오늘의 게임!</span><span class="sub-count">🎮</span></button></div>`;

}

function renderBar() {
  const q = $('search').value.trim();
  const st = STAGES[state.ui.stage - 1];
  $('viewTitle').textContent = q ? '🔍 찾은 결과'
    : state.ui.view === 'stage' ? st.pet + ' ' + st.no + '단계 ' + st.name
    : state.ui.view === 'game' ? '🎮 오늘의 게임!'
    : NAV.find(n => n.view === state.ui.view).icon + ' ' + NAV.find(n => n.view === state.ui.view).label;
  $('sort').value = state.ui.sort;
  $('sort').hidden = state.ui.view !== 'home' || !!q;
  $('avatar').textContent = state.learner.name.slice(0, 1);
  renderSaved();
}

function renderSaved() {
  $('savedAt').classList.toggle('warn', !storageOk);
  $('savedAt').textContent = !storageOk ? '⚠️ 브라우저 저장 안 됨 · 내보내기로 보관'
    : state.savedAt ? '💾 저장됨 ' + state.savedAt.slice(5) : '';
}

function renderView() {
  const q = $('search').value.trim();
  const v = q ? 'search' : state.ui.view;
  if (v !== 'game') stopGame();
  if (v !== 'adv') stopAdv();
  $('view').innerHTML = v === 'search' ? renderSearch(q)
    : v === 'stage' ? renderStage()
    : v === 'game' ? renderGame()
    : v === 'book' ? renderBook()
    : v === 'adv' ? renderAdv()
    : v === 'record' ? renderRecord()
    : renderHome();
  if (v === 'game') mountGame();
  if (v === 'adv') mountAdv();
}

// 학습 현황: 인사 배너 · 요약 카드 · 단계 카드 · 글자판 · 최근 기록
function renderHome() {
  const s = stats();
  const st = STAGES[state.ui.stage - 1];
  const kpis = [
    { icon: '📅', tone: 's4', label: '학습한 날', value: s.studyDays, unit: '일', sub: '최근 14일 중', spark: spark(s.dailyViews) },
    { icon: '⭐', tone: 's2', label: '읽은 글자', value: s.learned, unit: '개', sub: '전체 ' + s.total + '개 중 ' + pct(s.learned, s.total) + '%', spark: spark(s.cumUnique) },
    { icon: '📖', tone: 's3', label: '읽기 횟수', value: s.views, unit: '회', sub: '학습한 날 평균 ' + (s.studyDays ? Math.round(s.views14 / s.studyDays) : 0) + '회', spark: spark(s.cumViews) },
    { icon: '✏️', tone: 's1', label: '우리 아이 단어', value: state.custom[4].length + state.custom[5].length, unit: '개', sub: '단어 ' + state.custom[4].length + ' · 문장 ' + state.custom[5].length, spark: spark(s.cumAdds) }
  ];
  const filters = [['all', '전체'], ['doing', '읽는 중'], ['todo', '시작 전'], ['done', '다 읽음']];
  let cards = STAGES.map(x => Object.assign({ st: x }, stageCount(x.no)));
  cards.forEach(c => { c.p = c.total ? c.seen / c.total : 0; c.status = c.seen === 0 ? 'todo' : c.seen === c.total ? 'done' : 'doing'; });
  if (state.ui.sort === 'most') cards.sort((a, b) => b.p - a.p);
  if (state.ui.sort === 'least') cards.sort((a, b) => a.p - b.p);
  const hf = state.ui.homeFilter;
  const shown = cards.filter(c => hf === 'all' || c.status === hf);
  return `
    <section class="hello" style="${tone(st.no)}">
      <div class="hello-pet" aria-hidden="true">${st.pet}</div>
      <div class="hello-text">
        <p class="hello-hi">${esc(state.learner.name)}, 안녕!</p>
        <p class="hello-sub">오늘도 징검다리를 한 칸 건너 볼까요? 마지막으로 연 곳은 <b>${st.no}단계 ${esc(st.name)}</b>예요.</p>
      </div>
      <button class="btn big" data-act="stage" data-no="${st.no}">이어서 읽기 ▶</button>
    </section>
    <section class="kpis">${kpis.map(k => `
      <div class="kpi" style="--c:var(--${k.tone});--cs:var(--${k.tone}-soft)">
        <span class="kpi-icon" aria-hidden="true">${k.icon}</span>
        <p class="kpi-label">${k.label}</p>
        <b class="kpi-value">${k.value}<small>${k.unit}</small></b>
        <p class="kpi-sub">${k.sub}</p>${k.spark}
      </div>`).join('')}
    </section>
    <div class="home-grid">
      <section class="panel">
        <div class="panel-head"><h2>🪨 단계별 학습</h2>
          <div class="seg">${filters.map(([k, l]) => `<button class="${hf === k ? 'on' : ''}" data-act="homeFilter" data-f="${k}">${l}</button>`).join('')}</div>
        </div>
        <div class="scards">${shown.map(stageCard).join('') || '<p class="empty">이 조건에 맞는 단계가 없어요.</p>'}</div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>🔤 글자판</h2><p class="panel-note">자음 × 모음 · 글자를 누르면 카드가 열려요</p></div>
        ${matrix()}
      </section>
    </div>
    <section class="panel">
      <div class="panel-head"><h2>🕘 최근 학습 기록</h2><button class="link" data-act="view" data-view="record">전체 기록 보기 →</button></div>
      ${historyRows(8)}
    </section>`;
}

function stageCard(c) {
  const st = c.st;
  const subs = {
    1: '자음 14 · 모음 10',
    2: '자음 14 × 모음 10',
    3: '대표 받침 7개 · ' + c.total + '글자',
    4: WORD_GROUPS.map((g, gi) => '4.' + (gi + 1) + ' ' + groupCount(4, g).total + '개').join(' · '),
    5: c.total + '개 문장 · 20개씩'
  };
  const pill = { todo: '<span class="pill gray">시작 전</span>', doing: '<span class="pill sun">읽는 중</span>', done: '<span class="pill green">다 읽음 ⭐</span>' }[c.status];
  return `<button class="scard" data-act="stage" data-no="${st.no}" style="${tone(st.no)}">
    <div class="scard-top"><span class="scard-pet" aria-hidden="true">${st.pet}</span><span class="scard-mark">${esc(st.mark)}</span>${pill}</div>
    <div class="scard-main">
      ${ring(c.p)}
      <div class="scard-rows">
        <b class="scard-title">${st.no}. ${esc(st.name)}</b>
        <p>${subs[st.no]}</p>
        <p>읽은 카드 <b>${c.seen} / ${c.total}</b> · 최근 <b>${c.last ? c.last.slice(5) : '-'}</b></p>
      </div>
    </div>
  </button>`;
}

function matrix() {
  const head = VOWELS.map(v => `<span class="mx-h">${v[0]}</span>`).join('');
  const rows = CONSONANTS.map(([c]) => `<span class="mx-h">${c}</span>` + VOWELS.map(([v]) => {
    const t = compose(c, v);
    const n = state.items['s2:' + t] ? state.items['s2:' + t].views : 0;
    return `<button class="mx-cell v${Math.min(n, 2)}" data-act="cell" data-t="${t}" aria-label="${t} ${n}번 읽음">${t}</button>`;
  }).join('')).join('');
  return `<div class="matrix"><span></span>${head}${rows}</div>
    <div class="legend"><span><i class="v0"></i>아직</span><span><i class="v1"></i>1번 읽음</span><span><i class="v2"></i>2번 이상</span></div>`;
}

// 단계 학습: 레벨 지도(징검다리) · 묶음 칩 · 카드 목록
function renderStage() {
  const no = state.ui.stage;
  const st = STAGES[no - 1];
  const c = stageCount(no);
  const g = currentGroup(no);
  const items = visibleItems(no);
  const chipLabel = x => groupLabel(no, x);
  let html = `<nav class="stones" aria-label="학습 단계">${STAGES.map(s => {
      const k = stageCount(s.no);
      const on = s.no === no;
      const done = k.seen === k.total;
      return `<button class="stone${on ? ' on' : ''}${done ? ' done' : ''}" data-act="stage" data-no="${s.no}" aria-pressed="${on}"
          style="${tone(s.no)};--p:${k.total ? k.seen / k.total : 0}">
        ${on ? '<span class="here">' + s.pet + ' 지금 여기</span>' : ''}
        <span class="stone-ball"><span class="stone-mark">${esc(s.mark)}</span>${done ? '<span class="stone-star">⭐</span>' : ''}</span>
        <span class="stone-name"><i>${s.no}</i>${esc(s.name)}</span>
        <span class="stone-count">${k.seen} / ${k.total}</span></button>`;
    }).join('')}</nav>
    <section class="panel stage-panel" style="${tone(no)}">
      <div class="stage-head">
        <div class="stage-pet" aria-hidden="true">${st.pet}</div>
        <div class="stage-copy"><p class="eyebrow">${no}단계</p><h2 class="stage-title">${esc(st.name)}</h2><p class="desc">${esc(st.desc)}</p></div>
        <div class="meter"><span>읽은 카드</span><b>${c.seen}<small> / ${c.total}</small></b><i style="--p:${c.total ? c.seen / c.total : 0}"></i></div>

}

// 그림은 카드에서 [읽었어요!]를 누른 그 순간에만 보여 준다 (목록에는 그림 없이 ⭐만 표시 → 반복 학습 가능)

  return `<div class="grid g${no}">${items.map((it, i) => {
    const read = !!state.items[it.id];
    return `<button class="tile${read ? ' seen' : ''}" data-act="open" data-i="${i}" style="${tone(it.stage)}">

function renderAddForm(no) {
  const what = no === 4 ? '단어' : '문장';
  const mine = state.custom[no];
  return `<form class="panel add" id="addForm" data-no="${no}" style="${tone(no)}">
      <h2>✏️ 우리 아이 ${what} 추가</h2>
      ${addFields(no)}
      ${mine.length ? `<ul class="mine">${mine.map(m =>
        `<li>${esc(m.emoji)} ${esc(m.text)}<button type="button" data-act="del" data-no="${no}" data-text="${esc(m.text)}" aria-label="${esc(m.text)} 지우기">✕</button></li>`).join('')}</ul>` : ''}

function addFields(no) {
  return `<div class="add-row">
      <input id="addText" placeholder="${no === 4 ? '예: 김밥' : '예: 나는 그림을 그려요.'}" maxlength="40" required aria-label="추가할 내용">
      <input id="addEmoji" placeholder="그림" maxlength="8" aria-label="그림 이모지 (선택)">

}

function renderSearch(q) {
  const found = searchItems(q);
  window._searchList = found;
  return `<section class="panel">
    <div class="panel-head"><h2>"${esc(q)}" 찾은 결과 ${found.length}개</h2><button class="link" data-act="clearSearch">검색 지우기 ✕</button></div>
    ${found.length ? tiles(found, 0) : '<p class="empty">찾는 글자가 없어요. 다른 글자로 찾아보세요.</p>'}
  </section>`;
}

// 학습 기록부: 프로필 · 단계별 성적 · 전체 히스토리
function renderRecord() {
  const s = stats();
  const rows = STAGES.map(st => {
    const c = stageCount(st.no);
    const views = Object.entries(state.items).filter(([k]) => k.startsWith('s' + st.no + ':')).reduce((a, [, v]) => a + v.views, 0);
    return `<tr style="${tone(st.no)}"><td><span class="dot"></span>${st.pet} ${st.no}. ${esc(st.name)}</td><td>${c.seen} / ${c.total}</td>
      <td><span class="mini-bar"><i style="--p:${c.total ? c.seen / c.total : 0}"></i></span>${pct(c.seen, c.total)}%</td><td>${views}회</td><td>${c.last || '-'}</td></tr>`;
  }).join('');
  return `<div class="record-grid">
      <section class="panel profile-card">
        <div class="avatar big" aria-hidden="true">${esc(state.learner.name.slice(0, 1))}</div>
        <div><h2>${esc(state.learner.name)} <small>${state.learner.age}세</small></h2>
          <p class="desc">학습 시작 ${esc(state.learner.startDate)} · 마지막 저장 ${esc(state.savedAt || '-')}</p></div>
        <button class="btn" data-act="profileDialog">프로필 고치기</button>
      </section>
      <section class="panel sums">
        <div style="${tone(4)}"><span>📅 학습한 날</span><b>${s.allDays}일</b></div>
        <div style="${tone(2)}"><span>⭐ 읽은 글자</span><b>${s.learned}개</b></div>
        <div style="${tone(3)}"><span>📖 읽기 횟수</span><b>${s.views}회</b></div>
        <div style="${tone(5)}"><span>🗂️ 기록 건수</span><b>${state.history.length}건</b></div>
      </section>
    </div>
    ${renderAnalysis()}
    <section class="panel">
      <div class="panel-head"><h2>🏅 단계별 성적</h2></div>
      <div class="table-wrap"><table>
        <thead><tr><th>단계</th><th>읽은 카드</th><th>진도율</th><th>읽기 횟수</th><th>최근 학습</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>🕘 학습 히스토리</h2>
        <div class="seg">
          <button class="${histWrongOnly ? '' : 'on'}" data-act="histFilter" data-f="all">전체 ${state.history.length}</button>
          <button class="${histWrongOnly ? 'on' : ''}" data-act="histFilter" data-f="wrong">❌ 틀린 것만 ${wrongHistory().length}</button>
        </div>
      </div>
      ${historyPanelBody()}
    </section>`;
}

// 학습 히스토리: 전체 또는 틀린 것만, 최근 기록부터 10건씩
const wrongHistory = () => state.history.filter(h => h.type === 'quiz' && !h.ok);

function historyPanelBody() {
  const list = histWrongOnly ? wrongHistory() : state.history;
  const what = histWrongOnly ? '틀린 기록' : '기록';
  if (!list.length) return `<p class="empty">${histWrongOnly ? '틀린 기록이 없어요. 🎮 오늘의 게임에서 틀린 단어가 여기에 모여요.' : '아직 기록이 없어요.'}</p>`;
  return `<p class="panel-note">최근 ${what}부터 10건씩 · 전체 ${list.length}건</p>
    <div class="history-scroll" id="histScroll">${historyRows(histShown, list)}</div>
    ${list.length > histShown
      ? `<button class="btn more" data-act="moreHistory">더보기 +10 <small>(${histShown} / ${list.length})</small></button>`
      : `<p class="panel-note more-done">${what} ${list.length}건을 모두 보여 드렸어요.</p>`}`;
}

// 기능 11 (F-11) 학습 분석: 한글 떼기 예상일 · 하루 학습량 그래프 · 단계별 완료 예상
function renderAnalysis() {

  const noPace = f.pace === 0;

      <span class="mini-bar"><i style="--p:${s.total ? s.seen / s.total : 0}"></i></span>
      <span class="tl-left">${s.remain ? '남은 ' + s.remain + '개' : '다 읽음'}</span>
      <b class="tl-date">${fmt(s.doneDate)}</b>

    <div class="panel-head"><h2>📈 학습 분석 · 한글 떼기 예상</h2>
      <p class="panel-note">최근 ${PACE_DAYS}일 학습 속도로 계산 · ${today()} 기준</p></div>
    <div class="fc-top">
      <div class="fc-hero" style="${tone(5)}">
        <span class="fc-label">📚 책을 읽을 수 있는 날 (한글 떼기)</span>
        <b class="fc-date">${fmt(f.readyDate)} ${dd(f.readyDate)}</b>
        <span class="fc-sub">문장 단계 ${Math.round(READY_RATIO * 100)}%까지 · 남은 카드 ${f.readyRemain}개</span>
      </div>
      <div class="fc-stat" style="${tone(4)}"><span>🐢 하루 평균 새 카드</span><b>${f.pace.toFixed(1)}<small>개</small></b><span>최근 ${PACE_DAYS}일 중 ${f.studyDays7}일 학습</span></div>
      <div class="fc-stat" style="${tone(3)}"><span>🏁 모든 카드 완료</span><b>${fmt(f.allDate)}</b><span>남은 카드 ${f.allRemain}개 ${dd(f.allDate)}</span></div>
    </div>
    ${noPace ? '<p class="fc-warn">⚠️ 최근 7일 동안 새로 읽은 카드가 없어서 날짜를 예측할 수 없어요. 카드를 읽으면 바로 계산돼요.</p>' : ''}
    <div class="fc-body">
      <div class="fc-chart">
        <p class="fc-h">하루에 새로 읽은 카드 (최근 14일)
          <span class="bc-legend"><i class="lg-recent"></i>최근 ${PACE_DAYS}일 <i class="lg-avg"></i>7일 평균 ${f.pace.toFixed(1)}개</span></p>
        ${barChart(f.days, f.newPerDay, f.pace)}
      </div>
      <div class="fc-plan">
        <p class="fc-h">단계별 완료 예상일 (1단계부터 순서대로)</p>
        <ol class="timeline">${timeline}</ol>
        <div class="scenarios">${f.scenarios.map(s => `
          <div><span>하루 <b>${s.p}개</b>씩 읽으면</span><b>${fmt(s.date)}</b>${dd(s.date)}</div>`).join('')}
        </div>
      </div>
    </div>
    <p class="fc-note">계산 방법: 남은 카드 수 ÷ 최근 ${PACE_DAYS}일 하루 평균 새 카드 수. 지금은 처음 읽은 카드를 익힌 것으로 셉니다. 퀴즈(기능 4)를 붙이면 맞힌 카드 기준으로 바뀝니다.</p>

// 단일 계열 막대그래프: 최근 7일 막대는 진하게(평균 계산 구간), 점선은 7일 평균
function barChart(days, vals, avg) {
  const W = 560, H = 170, L = 30, B = 24, T = 14;
  const max = Math.max(4, Math.ceil(Math.max(...vals, avg) / 2) * 2);
  const ch = H - B - T, slot = (W - L) / vals.length, bw = Math.min(26, slot - 6);
  const y = v => T + ch - v / max * ch;
  const ticks = [0, max / 2, max];
  const grid = ticks.map(v => `<line class="bc-grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="bc-tick" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('');
  const bars = vals.map((v, i) => {
    const x = L + i * slot + (slot - bw) / 2, top = y(v), h = T + ch - top, r = Math.min(4, h);
    const recent = i >= vals.length - PACE_DAYS;
    const path = v > 0
      ? `<path class="bc-bar${recent ? ' recent' : ''}" d="M${x},${top + r} a${r},${r} 0 0 1 ${r},-${r} h${bw - 2 * r} a${r},${r} 0 0 1 ${r},${r} V${T + ch} H${x} Z"/>`
      : '';
    const label = i % 2 === vals.length % 2 ? '' : `<text class="bc-x" x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${days[i].slice(5).replace('-', '.')}</text>`;
    return `<g class="bc-col"><rect class="bc-hit" x="${L + i * slot}" y="${T}" width="${slot}" height="${ch}"/>${path}${label}
      <title>${days[i]} · 새 카드 ${v}개</title></g>`;
  }).join('');
  const avgLine = avg > 0 ? `<line class="bc-avg" x1="${L}" x2="${W}" y1="${y(avg)}" y2="${y(avg)}"/>` : '';
  return `<svg class="bar-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 14일 하루 새 카드 수">${grid}${bars}${avgLine}</svg>`;
}

/* ===== 오늘의 게임: 기능 4 퀴즈 · 기능 5 오답 반복을 점프 게임으로 ===== */
// 삐약이가 몬스터를 밟으면 글자 상자가 열리고, 단어에 맞는 그림을 고르면 몬스터를 물리친다. 틀리면 하트 -1
const G = { W: 960, H: 400, GROUND: 336, HERO_X: 190, GRAV: 2300, JUMP: 980, SIZE: 60 };
const MONSTERS = ['🐛', '🐌', '🦔', '🐞', '👾'];
let game = null;
let gameRaf = 0;
let gameLast = 0;
let gameSeq = 0;

function newGame() {
  return {
    id: ++gameSeq, level: state.ui.gameLevel, qs: pickQuestions(state.ui.gameLevel, GAME_ROUND), qi: 0,
    hearts: GAME_HEARTS, score: 0, right: 0, wrong: 0, phase: 'ready',
    hero: { y: G.GROUND, vy: 0 }, enemy: null, spawnIn: 0.8, t: 0, msg: '', msgT: 0, fx: [], feedback: null
  };
}

function startGame() {
  game = newGame();
  game.phase = 'run';
  renderGameUI();
  ensureLoop();
}

function heroJump() {
  if (!game || game.phase !== 'run' || game.hero.y < G.GROUND) return;
  game.hero.vy = -G.JUMP;
}

function say(msg) {
  game.msg = msg;
  game.msgT = 1.8;
}

function updateGame(dt) {
  const g = game, h = g.hero;
  g.t += dt;
  g.msgT = Math.max(0, g.msgT - dt);
  g.fx = g.fx.filter(p => (p.life -= dt) > 0);
  g.fx.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; });
  if (g.phase !== 'run') return;
  h.vy += G.GRAV * dt;
  h.y += h.vy * dt;
  if (h.y >= G.GROUND) { h.y = G.GROUND; h.vy = 0; }
  if (!g.enemy) {
    g.spawnIn -= dt;
    if (g.spawnIn <= 0) g.enemy = { x: G.W + 50, kind: MONSTERS[g.qi % MONSTERS.length], speed: 170 + GAME_LEVELS.findIndex(l => l.key === g.level) * 35 + g.qi * 6, passed: false };
    return;
  }
  const e = g.enemy;
  e.x -= e.speed * dt;
  const dx = Math.abs(e.x - G.HERO_X);
  if (!e.passed && h.vy > 0 && dx < 52 && h.y > G.GROUND - G.SIZE && h.y < G.GROUND - 8) {
    // 위에서 밟았다 → 글자 상자
    h.vy = -520;
    e.squash = true;
    g.phase = 'ask';
    renderGameUI();
  } else if (!e.passed && dx < 34 && h.y > G.GROUND - 24) {
    e.passed = true;
    say('점프해서 위에서 밟아요! ⬆️');
  }
  if (e.x < -70) { g.enemy = null; g.spawnIn = 0.5; }
}

function answerGame(i) {
  const g = game;
  if (!g || g.phase !== 'ask') return;
  const q = g.qs[g.qi];
  const ok = q.choices[i].id === q.it.id;
  recordQuiz(q.it.id, ok);
  if (ok) {
    g.right++;
    g.score += 10;
    for (let k = 0; k < 14; k++) g.fx.push({ x: g.enemy.x, y: G.GROUND - 40, vx: (Math.random() - .5) * 520, vy: -300 - Math.random() * 380, life: 1, s: '⭐' });
  } else {
    g.hearts--;
    g.wrong++;
  }
  g.feedback = { ok, it: q.it, chosen: q.choices[i] };
  g.phase = 'result';
  speak(q.it);
  renderGameUI();
  renderNav();
  const box = $('gameStats');
  if (box) box.innerHTML = renderGameStats();
  const id = g.id;
  setTimeout(() => { if (game && game.id === id) nextQuestion(); }, ok ? 1500 : 2600);
}

function nextQuestion() {
  const g = game;
  g.qi++;
  g.enemy = null;
  g.spawnIn = 0.9;
  g.feedback = null;
  if (g.hearts <= 0 || g.qi >= Math.min(GAME_ROUND, g.qs.length)) return endGame(g.hearts > 0);
  g.phase = 'run';
  renderGameUI();
}

function endGame(clear) {
  const g = game;
  g.phase = clear ? 'clear' : 'over';
  state.games.push({ t: nowStamp(), level: g.level, score: g.score, right: g.right, wrong: g.wrong, clear });
  if (state.games.length > GAME_LOG_MAX) state.games.splice(0, state.games.length - GAME_LOG_MAX);
  saveState();
  renderGameUI();
  const box = $('gameStats');
  if (box) box.innerHTML = renderGameStats();
}

function ensureLoop() {
  if (gameRaf) return;
  gameLast = performance.now();
  gameRaf = requestAnimationFrame(gameLoop);
}

function gameLoop(ts) {
  const cv = $('gameCanvas');
  if (!game || !cv || state.ui.view !== 'game') { gameRaf = 0; return; }
  const dt = Math.min(0.05, (ts - gameLast) / 1000);
  gameLast = ts;
  updateGame(dt);
  drawGame(cv.getContext('2d'));
  gameRaf = requestAnimationFrame(gameLoop);
}

function stopGame() {
  if (gameRaf) cancelAnimationFrame(gameRaf);
  gameRaf = 0;
  game = null;
}

const EMOJI_FONT = '"Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
function drawGame(c) {
  const g = game, { W, H, GROUND } = G;
  const sky = c.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, '#bfe4ff');
  sky.addColorStop(1, '#eef8ff');
  c.fillStyle = sky;
  c.fillRect(0, 0, W, H);
  c.fillStyle = '#ffe07a';
  c.beginPath(); c.arc(W - 110, 78, 38, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#ffffff';
  [[120, 70, 1], [470, 50, .8], [760, 120, .6]].forEach(([x0, y, s], i) => {
    const x = ((x0 - g.t * (14 + i * 6)) % (W + 200) + W + 200) % (W + 200) - 100;
    c.beginPath(); c.ellipse(x, y, 46 * s, 22 * s, 0, 0, Math.PI * 2); c.ellipse(x + 34 * s, y + 6 * s, 34 * s, 18 * s, 0, 0, Math.PI * 2); c.ellipse(x - 32 * s, y + 8 * s, 30 * s, 15 * s, 0, 0, Math.PI * 2); c.fill();
  });
  c.fillStyle = '#c9efd9';
  c.beginPath(); c.ellipse(220, GROUND + 20, 260, 110, 0, Math.PI, 0); c.fill();
  c.fillStyle = '#b4e7cb';
  c.beginPath(); c.ellipse(720, GROUND + 30, 320, 130, 0, Math.PI, 0); c.fill();
  // 땅: 풀 + 블록 무늬 (흐르는 것처럼)
  c.fillStyle = '#f2c07c';
  c.fillRect(0, GROUND, W, H - GROUND);
  c.fillStyle = '#6fcf8a';
  c.fillRect(0, GROUND, W, 14);
  c.strokeStyle = 'rgba(160, 100, 40, .25)';
  c.lineWidth = 3;
  const off = g.phase === 'run' ? (g.t * 170) % 48 : 0;
  for (let x = -off; x < W; x += 48) { c.beginPath(); c.moveTo(x, GROUND + 14); c.lineTo(x, H); c.stroke(); }
  c.beginPath(); c.moveTo(0, GROUND + 38); c.lineTo(W, GROUND + 38); c.stroke();
  c.textAlign = 'center';
  c.textBaseline = 'bottom';
  // 몬스터
  const e = g.enemy;
  if (e) {
    c.save();
    c.translate(e.x, GROUND + 4);
    if (e.squash) c.scale(1.25, .55);
    c.globalAlpha = e.passed ? .5 : 1;
    c.font = G.SIZE + 'px ' + EMOJI_FONT;
    c.fillText(e.kind, 0, 0);
    c.restore();
    if (g.phase === 'ask' || g.phase === 'result') {
      const bx = e.x - 30, by = GROUND - 150 + Math.sin(g.t * 6) * 4;
      c.fillStyle = '#ffb020';
      c.strokeStyle = '#b86f00';
      c.lineWidth = 4;
      c.beginPath(); c.roundRect(bx, by, 60, 60, 10); c.fill(); c.stroke();
      c.fillStyle = '#fff';
      c.font = 'bold 40px sans-serif';
      c.textBaseline = 'middle';
      c.fillText(g.phase === 'ask' ? '?' : g.feedback && g.feedback.ok ? '!' : '✕', bx + 30, by + 32);
      c.textBaseline = 'bottom';
    }
  }
  // 삐약이
  const h = g.hero;
  c.save();
  c.translate(G.HERO_X, h.y + 4);
  const air = h.y < GROUND;
  if (!air && g.phase === 'run') c.translate(0, Math.abs(Math.sin(g.t * 10)) * -4);
  if (air) c.rotate(-.12);
  c.font = '68px ' + EMOJI_FONT;
  c.fillText('🐥', 0, 0);
  c.restore();
  c.fillStyle = 'rgba(45, 50, 80, .12)';
  c.beginPath(); c.ellipse(G.HERO_X, GROUND + 6, 26 - (GROUND - h.y) / 12, 6, 0, 0, Math.PI * 2); c.fill();
  // 별 효과
  g.fx.forEach(p => { c.globalAlpha = Math.max(0, p.life); c.font = '26px ' + EMOJI_FONT; c.fillText(p.s, p.x, p.y); });
  c.globalAlpha = 1;
  if (g.msgT > 0) {
    c.font = 'bold 26px "Jua", sans-serif';
    c.fillStyle = '#2d3250';
    c.fillText(g.msg, W / 2, 60);
  }
}

// 게임 위에 얹는 화면(시작 · 글자 상자 · 결과 · 끝)과 상단 하트 표시
function renderGameUI() {
  const g = game, hud = $('gHud'), ov = $('gOverlay');
  if (!hud || !ov || !g) return;
  const L = GAME_LEVELS.find(l => l.key === g.level);
  hud.innerHTML = `<span class="g-hearts" aria-label="하트 ${g.hearts}개">${'❤️'.repeat(Math.max(0, g.hearts))}${'🤍'.repeat(GAME_HEARTS - Math.max(0, g.hearts))}</span>
    <span class="g-pill">⭐ ${g.score}</span><span class="g-pill">문제 ${Math.min(g.qi + 1, GAME_ROUND)} / ${GAME_ROUND}</span><span class="g-pill">${L.name}</span>`;
  let html = '';
  if (g.phase === 'ready') html = `<div class="g-card">
      <div class="g-big">🐥</div><h3>삐약이의 글자 모험</h3>
      <ol class="g-how"><li>⬆️ 점프해서 몬스터를 <b>위에서 밟아요</b></li><li>📦 글자 상자의 단어를 <b>읽고</b> 맞는 그림을 골라요</li><li>❤️ 틀리면 하트가 하나 줄어요 (하트 ${GAME_HEARTS}개)</li></ol>
      <button class="btn big go" data-act="gameStart">시작하기 ▶</button>
      <p class="g-tip">스페이스바나 화면을 눌러도 점프해요</p></div>`;
  if (g.phase === 'ask') {
    const q = g.qs[g.qi];
    html = `<div class="g-card g-box" style="${tone(q.it.stage)}">
      <p class="g-tag">📦 글자 상자!</p>
      <div class="g-word${q.it.stage === 5 ? ' long' : ''}">${esc(q.it.text)}</div>
      <p class="g-ask">이 ${q.it.stage === 5 ? '문장' : '단어'}에 맞는 그림을 골라요</p>
      <div class="g-choices">${q.choices.map((c, i) => `<button class="g-choice" data-act="gameAnswer" data-i="${i}" aria-label="${i + 1}번 그림">${esc(c.example[1])}<small>${i + 1}</small></button>`).join('')}</div>
    </div>`;
  }
  if (g.phase === 'result') {
    const f = g.feedback;
    html = `<div class="g-card g-result ${f.ok ? 'ok' : 'ng'}">
      <div class="g-big">${f.ok ? '🎉' : '💔'}</div>
      <h3>${f.ok ? '정답! 몬스터를 물리쳤어요' : '앗, 아쉬워요!'}</h3>
      <p class="g-answer"><span>${esc(f.it.example[1])}</span><b>${esc(f.it.text)}</b></p>
      ${f.ok ? '' : '<p class="g-tip">이 단어는 다음 게임에 다시 나와요 🔁</p>'}
    </div>`;
  }
  if (g.phase === 'over' || g.phase === 'clear') {
    const stars = g.right >= 9 ? 3 : g.right >= 6 ? 2 : g.right >= 1 ? 1 : 0;
    html = `<div class="g-card">
      <div class="g-big">${g.phase === 'clear' ? '🏆' : '😢'}</div>
      <h3>${g.phase === 'clear' ? GAME_ROUND + '문제 완주!' : '하트를 다 썼어요'}</h3>
      <p class="g-stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</p>
      <p class="g-tip">맞힌 문제 <b>${g.right}</b> · 틀린 문제 <b>${g.wrong}</b> · 점수 <b>${g.score}</b></p>
      <button class="btn big go" data-act="gameStart">다시 하기 ↻</button></div>`;
  }
  ov.innerHTML = html;
  ov.hidden = !html;
  // 점프하던 스페이스가 답을 고르지 않도록 글자 상자에서는 버튼에 포커스를 주지 않는다
  const go = ov.querySelector('.go');
  if (go) go.focus({ preventScroll: true });
  else if (document.activeElement && document.activeElement.closest('.g-overlay')) document.activeElement.blur();
}

// 기능 4·5 (F-04, F-05) 게임 성적 · 약점 단어
function renderGameStats() {
  const s = quizSummary();

  const todays = state.games.filter(g => g.t.startsWith(td));
  const best = state.games.reduce((a, g) => Math.max(a, g.score), 0);
  const rate = s.right + s.wrong ? Math.round(s.right / (s.right + s.wrong) * 100) : 0;

          <div style="${tone(1)}"><span>🏆 최고 점수</span><b>${best}점</b></div>
          <div style="${tone(3)}"><span>✅ 정답률</span><b>${rate}%</b></div>
          <div style="${tone(4)}"><span>🧠 익힌 단어</span><b>${s.mastered}개</b></div>

          <span class="${g.clear ? 'act-view' : 'act-remove'}">${g.clear ? '완주 🏆' : '하트 소진'} · 맞힘 ${g.right} · 틀림 ${g.wrong}</span></li>`).join('') || '<li class="empty">아직 한 게임이 없어요.</li>'}</ol>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>🔁 다시 연습할 단어</h2><p class="panel-note">2번 이상 틀린 단어 · 다음 게임에 먼저 나와요</p></div>
        ${s.weak.length ? `<ul class="weak-list">${s.weak.map(w => `<li style="${tone(w.stage)}"><b>${esc(w.text)}</b><span>✗ ${w.q.w} · ✓ ${w.q.r}</span></li>`).join('')}</ul>`
          : '<p class="empty">아직 약점 단어가 없어요. 게임을 하면 자주 틀린 단어가 여기에 모여요.</p>'}
        <p class="fc-note">익힘 기준: 최근 3번 중 2번 이상 정답 · 약점 기준: 2번 이상 틀렸고 아직 익히기 전</p>

}

function mountGame() {
  if (!game || game.level !== state.ui.gameLevel && game.phase === 'ready') game = newGame();
  renderGameUI();

}

function historyRows(n, source) {
  const list = (source || state.history).slice(-n).reverse();
  if (!list.length) return '<p class="empty">아직 기록이 없어요. 단계 카드를 읽으면 여기에 쌓여요.</p>';
  return `<ol class="history">${list.map(h => {
    const no = Number(h.id.slice(1, 2));
    const act = h.type === 'quiz'
      ? `<span class="${h.ok ? 'act-view' : 'act-remove'}">🎮 ${h.ok ? '게임에서 맞혔어요' : '게임에서 틀렸어요'}</span>`
      : `<span class="act-${esc(h.type)}">${ACT_LABEL[h.type] || esc(h.type)}</span>`;
    return `<li style="${tone(no)}"><time>${esc(h.t.slice(5))}</time><span class="pill stage">${no}단계</span><b>${esc(h.id.slice(3))}</b>${act}</li>`;
  }).join('')}</ol>`;
}

// 기능 1 (F-01) 크게 보기 카드: [읽었어요!]를 누르면 그림이 나오고 다음 카드로 넘어간다
function openCard(list, i) {
  cardList = list;
  cardIdx = i;
  cardRead = false;
  $('card').hidden = false;
  renderCard();
  $('card').querySelector('[data-act="read"]').focus();
}

function closeCard() {
  clearTimeout(cardTimer);
  stopSpeak();
  $('card').hidden = true;
}

function renderCard() {
  const it = cardList[cardIdx];
  const st = STAGES[it.stage - 1];
  const last = cardIdx === cardList.length - 1;
  let parts = '';
  if (it.stage === 2 || it.stage === 3)
    parts = `<div class="formula"><span>${esc(it.parts[0])}</span><em>+</em><span>${esc(it.parts[1])}</span><em>=</em><span class="res">${esc(it.text)}</span></div>`;
  if (it.stage >= 4)
    parts = `<div class="pieces">${it.parts.map(p => `<span>${esc(p)}</span>`).join('')}</div>`;
  let reward = '';
  if (cardRead) {
    if (it.stage >= 4) reward = `<div class="reveal big-emoji" aria-hidden="true">${esc(it.example[1])}</div>`;
    else if (it.example) {
      const [w, e] = it.example;
      reward = `<div class="reveal example"><span class="ex-emoji" aria-hidden="true">${e}</span><span class="ex-word">${markIn(w, it)}</span></div>`;
    }
    reward += `<p class="reveal cheer">${cheerWord()}</p>
      <button class="listen" data-act="listen" aria-label="${esc(speechText(it))} 다시 듣기">🔊 다시 듣기</button>`;
  } else {
    reward = `<div class="mystery" aria-hidden="true"><span class="mystery-q">?</span><span>읽으면 그림이 나와요</span></div>`;
  }
  const btn = !cardRead
    ? `<button class="primary" data-act="read">읽었어요!</button>`
    : last ? `<button class="primary" data-act="close">다 읽었어요 🎉</button>`
    : `<button class="primary next" data-act="next">다음 ▶</button>`;
  $('card').innerHTML = `<div class="sheet card-sheet s${it.stage}" role="dialog" aria-modal="true" aria-label="${esc(it.text)} 카드" style="${tone(it.stage)}">
      <button class="close" data-act="close" aria-label="닫기">✕</button>
      <p class="sheet-tag">${st.pet} ${st.no}단계 · ${esc(st.name)}${it.group && it.stage !== 1 ? ' · ' + esc(it.group) + (it.stage === 3 ? ' 받침' : '') : ''}</p>
      <div class="glyph">${esc(it.text)}</div>
      ${it.label ? `<p class="glyph-name">${esc(it.label)}</p>` : ''}
      ${parts}
      <div class="reward">${reward}</div>
      <div class="sheet-nav">
        <button data-act="prev" aria-label="이전 카드" ${cardIdx === 0 ? 'disabled' : ''}>◀</button>
        ${btn}
        <button data-act="next" aria-label="다음 카드" ${last ? 'disabled' : ''}>▶</button>
      </div>
      <p class="count">${cardIdx + 1} / ${cardList.length}${state.items[it.id] ? ' · ' + state.items[it.id].views + '번 읽음' : ''}</p>
    </div>`;
}

// 예시 단어 안에서 지금 글자를 강조 (1단계는 자모가 들어간 첫 글자)
function markIn(word, it) {
  const target = it.stage === 1 ? word[0] : it.text;
  const i = word.indexOf(target);
  if (i < 0) return esc(word);
  return esc(word.slice(0, i)) + '<b>' + esc(target) + '</b>' + esc(word.slice(i + target.length));
}

// 기능 2 (F-02) [읽었어요!] → 소리 내어 읽어 주고, 다 읽으면 다음 카드로
function readCard() {
  const it = cardList[cardIdx];
  recordView(it.id);
  cardRead = true;
  renderCard();
  renderNav();
  renderView();
  clearTimeout(cardTimer);
  const hasNext = cardIdx < cardList.length - 1;
  const next = () => { clearTimeout(cardTimer); cardTimer = setTimeout(() => moveCard(1), 900); };
  // 음성이 끝나면 넘어가고, 끝 신호가 오지 않는 기기를 위해 글자 길이만큼 기다린 뒤 넘어간다
  const spoke = speak(it, hasNext ? next : null);
  if (hasNext) cardTimer = setTimeout(() => moveCard(1), spoke ? Math.max(2600, speechText(it).length * 380 + 1800) : 1800);
}

function moveCard(d) {
  const n = cardIdx + d;
  if (n < 0 || n >= cardList.length) return;
  clearTimeout(cardTimer);
  stopSpeak();
  cardIdx = n;
  cardRead = false;
  renderCard();
}

/* ===== 대화상자 (단어 추가 · 프로필 · 되돌리기 확인) ===== */

function closeDialog() {
  $('dialog').hidden = true;
}

/* ===== 이벤트 연결 ===== */
function bind() {
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    if (act.startsWith('r2')) r2Click(b);
    if (act === 'view') { histShown = HIST_STEP; state.ui.view = b.dataset.view; $('search').value = ''; saveState(); renderAll(); }
    if (act === 'stage') {
      state.ui.view = 'stage';
      state.ui.stage = Number(b.dataset.no);
      if (b.dataset.g) state.ui.filter[state.ui.stage] = b.dataset.g;
      $('search').value = ''; saveState(); renderAll();
    }
    if (act === 'group') { state.ui.filter[state.ui.stage] = b.dataset.g; saveState(); renderView(); }
    if (act === 'homeFilter') { state.ui.homeFilter = b.dataset.f; saveState(); renderView(); }
    if (act === 'open') {
      const list = $('search').value.trim() ? window._searchList : visibleItems(state.ui.stage);
      openCard(list, Number(b.dataset.i));
    }
    if (act === 'cell') {
      const [c] = decompose(b.dataset.t);
      state.ui.filter[2] = c;
      const list = visibleItems(2);
      openCard(list, list.findIndex(it => it.text === b.dataset.t));
    }
    if (act === 'read') readCard();
    if (act === 'listen') { clearTimeout(cardTimer); speak(cardList[cardIdx]); }
    if (act === 'close') closeCard();
    if (act === 'prev') moveCard(-1);
    if (act === 'next') moveCard(1);
    if (act === 'del') { removeCustom(Number(b.dataset.no), b.dataset.text); renderNav(); renderView(); toast('지웠어요.'); }
    if (act === 'gameStart') startGame();
    if (act === 'gameJump') heroJump();
    if (act === 'gameAnswer') answerGame(Number(b.dataset.i));
    if (act === 'gameLevel') {
      state.ui.gameLevel = b.dataset.k;
      saveState();
      if (!game || game.phase !== 'run' && game.phase !== 'ask' && game.phase !== 'result') game = null;
      renderView();
    }
    if (act === 'histFilter') {
      histWrongOnly = b.dataset.f === 'wrong';
      histShown = HIST_STEP;
      renderView();
    }
    if (act === 'moreHistory') {
      histShown += HIST_STEP;
      renderView();
      const box = $('histScroll');
      if (box) box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
    }
    if (act === 'clearSearch') { $('search').value = ''; renderAll(); }
    if (act === 'save') saveState(true);
    if (act === 'export') exportRecord();
    if (act === 'addDialog') openDialog('add');
    if (act === 'profileDialog') openDialog('profile');
    if (act === 'resetDialog') openDialog('reset');
    if (act === 'closeDialog') closeDialog();
    if (act === 'reset') { closeDialog(); resetToSample(); }
  });
  $('card').addEventListener('click', e => { if (e.target === $('card')) closeCard(); });
  $('dialog').addEventListener('click', e => { if (e.target === $('dialog')) closeDialog(); });
  // 오늘의 게임 조작: 스페이스 · ↑ 점프, 1·2·3 답 고르기, 화면 누르기 점프
  document.addEventListener('keydown', e => {
    if (!game || state.ui.view !== 'game' || !$('dialog').hidden || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if ((e.code === 'Space' || e.key === 'ArrowUp') && game.phase !== 'ready' && game.phase !== 'over' && game.phase !== 'clear') { e.preventDefault(); heroJump(); }
    if (game.phase === 'ask' && /^[1-3]$/.test(e.key)) answerGame(Number(e.key) - 1);
  });
  document.addEventListener('pointerdown', e => {
    if (e.target.id === 'gameCanvas') heroJump();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeDialog(); closeCard(); }
    if ($('card').hidden) return;
    if (e.key === 'ArrowLeft') moveCard(-1);
    if (e.key === 'ArrowRight') moveCard(1);
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target;
    if (f.id === 'addForm' || f.id === 'dialogAdd') {
      const no = f.id === 'addForm' ? Number(f.dataset.no) : Number(f.querySelector('[name=addStage]:checked').value);
      const err = addCustom(no, f.querySelector('#addText').value, f.querySelector('#addEmoji').value);
      if (err) { const el = f.querySelector('#addErr'); el.textContent = err; el.hidden = false; return; }
      if (f.id === 'dialogAdd') closeDialog();
      renderNav(); renderView();
      toast('✏️ ' + (no === 4 ? '단어' : '문장') + '를 추가했어요.');
    }
    if (f.id === 'dialogProfile') {
      state.learner.name = $('pName').value.trim().slice(0, 10) || state.learner.name;
      state.learner.age = Math.min(9, Math.max(3, Number($('pAge').value) || state.learner.age));
      if (/^\d{4}-\d{2}-\d{2}$/.test($('pStart').value)) state.learner.startDate = $('pStart').value;
      saveState(); closeDialog(); renderAll();
      toast('🧒 프로필을 저장했어요.');
    }
  });
  document.addEventListener('change', e => {
    if (e.target.name === 'addStage')
      $('addText').placeholder = e.target.value === '4' ? '예: 김밥' : '예: 나는 그림을 그려요.';
  });
  $('search').addEventListener('input', () => renderAll());
  $('sort').addEventListener('change', e => { state.ui.sort = e.target.value; saveState(); renderView(); });
  $('importFile').addEventListener('change', e => {
    if (e.target.files[0]) importRecord(e.target.files[0]);
    e.target.value = '';
  });
  window.addEventListener('storage', syncFromOtherWindow);
}

/* ===== 보조 기능 ===== */
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => fmtDate(new Date());
const nowStamp = () => { const d = new Date(); return fmtDate(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
function addDays(s, n) {
  const [y, m, d] = s.split('-').map(Number);
  return fmtDate(new Date(y, m - 1, d + n));
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

// 요약 수치: 최근 14일 흐름과 누적값
function stats() {
  const days = [];
  for (let i = 13; i >= 0; i--) days.push(addDays(today(), -i));
  const views = state.history.filter(h => h.type === 'view');
  const byDay = {};
  const first = {};
  views.forEach(h => {
    const d = h.t.slice(0, 10);
    byDay[d] = (byDay[d] || 0) + 1;
    if (!first[h.id]) first[h.id] = d;
  });
  const firsts = Object.values(first);
  const adds = state.history.filter(h => h.type === 'add').map(h => h.t.slice(0, 10));
  const dailyViews = days.map(d => byDay[d] || 0);
  return {
    dailyViews,
    studyDays: dailyViews.filter(n => n > 0).length,
    allDays: Object.keys(byDay).length,
    views14: dailyViews.reduce((a, b) => a + b, 0),
    views: Object.values(state.items).reduce((a, v) => a + v.views, 0),
    learned: Object.keys(state.items).length,
    total: STAGES.reduce((a, st) => a + buildItems(st.no).length, 0),
    cumUnique: days.map(d => firsts.filter(f => f <= d).length),
    cumViews: days.map(d => views.filter(h => h.t.slice(0, 10) <= d).length),
    cumAdds: days.map(d => adds.filter(a => a <= d).length)
  };
}

function spark(vals) {
  const w = 120, h = 40, max = Math.max(1, ...vals);
  const pts = vals.map((v, i) => [i * w / (vals.length - 1), h - 4 - v / max * (h - 10)]);
  const line = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const [lx, ly] = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polygon class="spark-area" points="0,${h} ${line} ${w},${h}"/><polyline class="spark-line" points="${line}"/>
    <circle class="spark-dot" cx="${lx}" cy="${ly}" r="3.6"/></svg>`;
}

function ring(p) {
  const r = 26, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
    <circle class="ring-bg" cx="32" cy="32" r="${r}"/>
    <circle class="ring-fg" cx="32" cy="32" r="${r}" stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)"/>
    <text x="32" y="37" text-anchor="middle">${Math.round(p * 100)}%</text></svg>`;
}

function tickClock() {
  const d = new Date();
  const wd = '일월화수목금토'[d.getDay()];
  $('clock').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 (${wd}) ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}
function cheerWord() {

<script>
/* ===== Rev.2 추가: 대윤이 빈 기록 · 📖 동화책 읽기 · 🗺️ 징검다리 모험 · 더보기 메뉴 ===== */
// 이 블록은 Rev.1 코드를 고치지 않고 위에 얹는다. 연결 지점: VIEWS · NAV · renderView · bind(click) · normalize · loadState

// {n}는 → 이름 받침에 따라 은/는 · 이/가 · 을/를 · 과/와
function fillName(t) {
  const n = state.learner.name;
  const alt = { '는': '은', '가': '이', '를': '을', '와': '과' };
  return t.replace(/\{n\}(는|가|를|와)/g, (m, p) => n + (hasBatchim(n.slice(-1)) ? alt[p] : p)).replace(/\{n\}/g, n);
}
const plain = w => w.replace(/[.,!?]/g, '');

function makeBlank() {
  return {
    app: APP_ID, version: 2, savedAt: '',
    learner: { name: '대윤이', age: 6, startDate: today() },

    ui: { view: 'home', stage: 4, filter: {}, sort: 'no', homeFilter: 'all', gameLevel: 'easy' }
  };
}

/* ---------- 📖 동화책: 문장이 이어져서 이야기가 된다. 뒤로 갈수록 문장이 길어진다 ---------- */
const STORIES = [
  { id: 'b1', level: 1, cover: '🐰', title: '토끼와 당근', pages: [
    ['🐰', '토끼가 있어요.'], ['🥕', '당근이 있어요.'], ['😋', '토끼가 당근을 먹어요.'],
    ['🐰', '냠냠 맛있어요.'], ['😴', '토끼가 잠을 자요.'], ['🌙', '잘 자요, 토끼야.'] ] },
  { id: 'b2', level: 2, cover: '🚂', title: '구름 기차', pages: [
    ['☁️', '하늘에 구름 기차가 와요.'], ['🚂', '칙칙폭폭 기차가 달려요.'], ['🐘', '코끼리가 기차를 타요.'],
    ['🐒', '원숭이도 기차를 타요.'], ['🌈', '기차가 무지개 위를 지나가요.'], ['🏠', '모두 집에 도착했어요.'] ] },
  { id: 'b3', level: 3, cover: '☔', title: '비 오는 날', pages: [
    ['🌧️', '아침부터 비가 와요.'], ['☂️', '{n}는 노란 우산을 써요.'], ['🐸', '개구리가 웅덩이에서 폴짝 뛰어요.'],
    ['🐌', '달팽이도 느릿느릿 나와요.'], ['🌈', '비가 그치고 무지개가 떴어요.'], ['😊', '{n}는 친구들과 함께 웃었어요.'] ] },
  { id: 'b4', level: 4, cover: '🐻', title: '곰돌이의 생일', pages: [
    ['🐻', '오늘은 곰돌이의 생일이에요.'], ['🎂', '{n}는 친구들과 케이크를 만들어요.'], ['🍓', '딸기를 하나씩 올리고 초를 꽂아요.'],
    ['🎈', '토끼가 풍선을 불어 와요.'], ['🎵', '모두 함께 생일 노래를 불러요.'], ['🎁', '곰돌이는 고맙다고 크게 말했어요.'] ] },
  { id: 'b5', level: 5, cover: '⭐', title: '별빛 모험', pages: [
    ['🌙', '밤하늘에 반짝이는 별이 보였어요.'], ['🪜', '{n}는 사다리를 타고 높이 올라갔어요.'],
    ['🦉', '부엉이가 별에게 인사를 해 보라고 말했어요.'], ['✨', '{n}가 안녕 하고 손을 흔들자 별이 웃었어요.'],
    ['🌠', '별똥별이 소원을 들어주러 내려왔어요.'], ['📖', '{n}는 매일 한글을 읽는 아이가 되고 싶다고 빌었어요.'] ] }
].map(s => Object.assign(s, { pages: s.pages.map(p => ({ e: p[0], s: p[1] })) }));

function normBooks(b) {
  const out = {};
  STORIES.forEach(s => {
    const v = b && b[s.id];
    if (!v) return;
    const ok = a => Array.isArray(a) ? [...new Set(a.map(Number).filter(i => Number.isInteger(i) && i >= 0 && i < s.pages.length))] : [];
    const read = ok(v.read), solo = ok(v.solo);
    if (read.length || solo.length) out[s.id] = { read, solo };
  });
  return out;
}

let bk = { id: null, page: 0, mode: 'solo' };
const bookOf = id => STORIES.find(s => s.id === id);
function bookProg(s) {
  const r = state.books[s.id] || { read: [], solo: [] };
  return { done: new Set(r.read.concat(r.solo)).size, solo: r.solo.length, total: s.pages.length };
}

function renderBook() {
  if (!bk.id) {
    return `<section class="panel" style="${tone(5)}">
      <div class="panel-head"><h2>📖 동화책 읽기</h2><p class="panel-note">단어를 누르면 소리가 나요 · 혼자 읽고 ✅ 를 눌러요</p></div>
      <div class="bk-grid">${STORIES.map(s => {
        const p = bookProg(s);
        return `<button class="bk-card" data-act="r2Book" data-id="${s.id}" style="${tone(s.level)}">
          <span class="bk-cover">${s.cover}</span><b>${esc(fillName(s.title))}</b>
          <small>${'⭐'.repeat(s.level)} · ${s.pages.length}쪽</small>
          <span class="bk-bar"><i style="width:${p.done / p.total * 100}%"></i></span>
          <small>${p.solo === p.total ? '🏆 혼자 다 읽었어요' : p.done + ' / ' + p.total + '쪽 읽음'}</small></button>`;
      }).join('')}</div></section>`;
  }
  const s = bookOf(bk.id), pg = s.pages[bk.page];
  const words = fillName(pg.s).split(' ');

    <div class="panel-head"><button class="btn" data-act="r2BookList">◀ 책 목록</button><h2>${s.cover} ${esc(fillName(s.title))}</h2>
      <span class="g-pill">${bk.page + 1} / ${s.pages.length}쪽</span></div>
    <div class="bk-pic" aria-hidden="true">${pg.e}</div>
    <p class="bk-text">${words.map((w, i) => `<button class="bk-w" data-act="r2Word" data-i="${i}">${esc(w)}</button>`).join(' ')}</p>
    <div class="seg bk-mode"><button class="${bk.mode === 'solo' ? 'on' : ''}" data-act="r2Mode" data-m="solo">🙋 혼자 읽기</button>
      <button class="${bk.mode === 'together' ? 'on' : ''}" data-act="r2Mode" data-m="together">👨‍👩‍👦 같이 읽기</button></div>
    <div class="bk-ctl">
      <button class="btn" data-act="r2Page" data-d="-1" ${bk.page === 0 ? 'disabled' : ''}>◀ 이전</button>
      <button class="btn" data-act="r2Along">🔊 ${bk.mode === 'together' ? '같이 읽어요' : '들어 볼래요'}</button>
      <button class="btn big" data-act="r2Done" style="${tone(3)}">✅ ${bk.mode === 'solo' ? '내가 읽었어요' : '다 읽었어요'}</button>
      <button class="btn" data-act="r2Page" data-d="1" ${bk.page === s.pages.length - 1 ? 'disabled' : ''}>다음 ▶</button>
    </div>
    <p class="panel-note">모르는 글자는 눌러서 소리를 들어요. 어려운 쪽은 '같이 읽기'로 따라 읽어요.</p></section>`;
}

function readAlong(words, i) {
  document.querySelectorAll('.bk-w').forEach((el, k) => el.classList.toggle('now', k === i));
  if (i >= words.length) return;
  speak({ stage: 4, text: plain(words[i]) }, () => readAlong(words, i + 1));
}

function bookDone() {
  const s = bookOf(bk.id);
  const r = state.books[s.id] || (state.books[s.id] = { read: [], solo: [] });
  const key = bk.mode === 'solo' ? 'solo' : 'read';
  if (!r[key].includes(bk.page)) r[key].push(bk.page);
  saveState();
  stopSpeak();
  if (bk.page < s.pages.length - 1) { bk.page++; toast('🌟 잘 읽었어요!'); }
  else { toast('🎉 「' + fillName(s.title) + '」 끝! 참 잘 읽었어요'); bk.id = null; }
  renderView();
}

/* ---------- 🗺️ 징검다리 모험: 가로로 달리는 읽기 플랫폼 게임 (Rev.1 점프 게임과 별도) ---------- */
// 📦 블록을 머리로 치면 소리 듣고 단어 고르기 · 🌊 끊어진 다리는 빠진 글자 고르기 · 🐰 갇힌 친구는 단어 카드로 문장 만들기
const ADV_COURSES = [
  { key: 'c1', name: '숲속 징검다리', icon: '🌳', sky: ['#bfe8ff', '#eaf8ff'], ground: '#8fdc72', deco: ['🌲', '🌳', '🍄', '🌼'], pool: 'easy', sent: [2, 3], friend: '🐰', desc: '받침 없는 단어 · 짧은 문장' },
  { key: 'c2', name: '바닷가 징검다리', icon: '🏖️', sky: ['#ffe6c7', '#fff6e8'], ground: '#f3d9a0', deco: ['🌴', '🐚', '⛵', '🦀'], pool: 'normal', sent: [3, 3], friend: '🐻', desc: '받침 있는 단어 · 세 단어 문장' },
  { key: 'c3', name: '하늘 징검다리', icon: '☁️', sky: ['#d9ccff', '#f1ebff'], ground: '#e4defc', deco: ['🌈', '⭐', '🎈', '🪁'], pool: 'normal', sent: [4, 9], friend: '🦊', desc: '받침 있는 단어 · 긴 문장' }
];
const ADV_PLAN = ['coin', 'block', 'coin', 'bridge', 'block', 'coin', 'block', 'bridge', 'coin', 'friend', 'flag'];
const ADV_HEARTS = 3;
let adv = null, advRaf = 0, advLast = 0, advCourse = 'c1';

function normAdv(a) {
  const stars = {};
  ADV_COURSES.forEach(c => {
    const n = Math.floor(Number(a && a.stars && a.stars[c.key]));
    if (n >= 1 && n <= 3) stars[c.key] = n;
  });
  return { stars };
}

const advUnlocked = k => {
  const i = ADV_COURSES.findIndex(c => c.key === k);
  return i === 0 || (state.adv.stars[ADV_COURSES[i - 1].key] || 0) >= 1;
};

// 한 코스의 문제를 미리 만든다 (약한 단어가 먼저 나온다: Rev.1의 오답 반복 로직 재사용)
function newAdv(key) {
  const c = ADV_COURSES.find(k => k.key === key);
  const pool = levelPool(c.pool);
  const ranked = pickQuestions(c.pool, Math.min(pool.length, 14)).map(q => q.it);
  const blockIts = ranked.slice(0, 3);
  const bridgeIts = ranked.filter(it => [...it.text].length >= 2 && !blockIts.includes(it)).slice(0, 2);
  const syl = shuffle([...new Set(pool.flatMap(it => [...it.text]))]);
  const rk = { weak: 0, learning: 1, new: 2, mastered: 3 };
  let sp = levelPool('hard').filter(it => { const n = it.text.split(' ').length; return n >= c.sent[0] && n <= c.sent[1]; });
  if (!sp.length) sp = levelPool('hard');
  const sit = shuffle(sp).sort((a, b) => rk[mastery(a.id)] - rk[mastery(b.id)])[0];
  const words = sit.text.split(' ');
  let chips = shuffle(words.map(w => ({ w, used: false })));
  if (words.length > 1 && chips.every((ch, i) => ch.w === words[i])) chips = chips.reverse();
  let bi = 0, ki = 0, x = 700;
  const objs = ADV_PLAN.map(t => {
    const o = { type: t, x, done: false };
    if (t === 'block') {
      const it = blockIts[bi++];
      o.q = { it, choices: shuffle([it.text].concat(shuffle(pool.filter(p => p.text !== it.text)).slice(0, 2).map(p => p.text))) };
    }
    if (t === 'bridge') {
      const it = bridgeIts[ki++] || blockIts[0];
      const chars = [...it.text], idx = Math.floor(Math.random() * chars.length), ch = chars[idx];
      o.q = { it, chars, idx, ch, choices: shuffle([ch].concat(syl.filter(s => s !== ch).slice(0, 2))) };
    }
    if (t === 'friend') o.q = { it: sit, words, chips, next: 0, pen: false };
    x += t === 'coin' ? 340 : 520;
    return o;
  });
  return { c, objs, total: objs.filter(o => o.q).length, sx: 0, hero: { y: G.GROUND, vy: 0 }, hearts: ADV_HEARTS, coins: 0, wrong: 0,
    phase: 'ready', t: 0, fx: [], cur: null, fb: null, waiting: false, tk: 0, stars: 0 };
}

function renderAdv() {
  if (!advUnlocked(advCourse)) advCourse = ADV_COURSES[0].key;
  return `<section class="panel game-panel" style="${tone(3)}">
    <div class="panel-head"><h2>🗺️ 징검다리 모험</h2>
      <div class="seg">${ADV_COURSES.map(c => {
        const s = state.adv.stars[c.key] || 0, lock = !advUnlocked(c.key);
        return `<button class="${c.key === advCourse ? 'on' : ''}" data-act="r2Course" data-k="${c.key}" ${lock ? 'disabled' : ''}>${lock ? '🔒' : c.icon} ${esc(c.name)} ${'⭐'.repeat(s)}</button>`;
      }).join('')}</div></div>
    <div class="game-stage"><canvas id="advCanvas" width="${G.W}" height="${G.H}" aria-label="징검다리 모험 화면. 점프 버튼이나 스페이스바로 점프해요"></canvas>
      <div class="g-hud" id="advHud"></div></div>
    <div class="game-controls"><button class="btn big jump" data-act="r2Jump">⬆️ 점프!</button>
      <span class="panel-note">📦 블록 아래에서 점프하면 머리로 쳐요 · 스페이스바나 화면을 눌러도 점프해요</span></div>
    <div class="adv-panel" id="advPanel"></div></section>`;
}

function mountAdv() {
  if (!adv || adv.c.key !== advCourse) adv = newAdv(advCourse);
  renderAdvUI();
  if (!advRaf) { advLast = performance.now(); advRaf = requestAnimationFrame(advLoop); }
}
function stopAdv() {
  if (advRaf) cancelAnimationFrame(advRaf);
  advRaf = 0;
  adv = null;
}
function advLoop(ts) {
  const cv = $('advCanvas');
  if (!adv || !cv || state.ui.view !== 'adv') { advRaf = 0; return; }
  const dt = Math.min(0.05, (ts - advLast) / 1000);
  advLast = ts;
  updateAdv(dt);
  drawAdv(cv.getContext('2d'));
  advRaf = requestAnimationFrame(advLoop);
}

function burst(a, x, y, s, n) {
  for (let k = 0; k < n; k++) a.fx.push({ x, y, vx: (Math.random() - .5) * 480, vy: -260 - Math.random() * 360, life: 1, s });
}

function updateAdv(dt) {
  const a = adv, h = a.hero;
  a.t += dt;
  a.fx = a.fx.filter(p => (p.life -= dt) > 0);
  a.fx.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; });
  h.vy += G.GRAV * dt;
  h.y += h.vy * dt;
  if (h.y >= G.GROUND) { h.y = G.GROUND; h.vy = 0; }
  a.waiting = false;
  if (a.phase !== 'run') return;
  const o = a.objs.find(k => !k.done);
  const px = o ? o.x - a.sx : 1e9;
  if (o && o.type === 'block' && px <= G.HERO_X + 55) {
    if (h.y <= G.GROUND - 90) return hitBlock(o);      // 점프해서 머리로 쳤다
    if (px <= G.HERO_X + 20) { a.waiting = true; return; } // 블록 아래에서 점프를 기다린다
  }
  if (o && o.type === 'bridge' && px - 75 <= G.HERO_X + 40) return askAdv(o);
  if (o && o.type === 'friend' && px <= G.HERO_X + 150) return askAdv(o);
  if (o && o.type === 'flag' && px <= G.HERO_X + 10) return endAdv(true);
  if (o && o.type === 'coin' && px <= G.HERO_X + 40) { o.done = true; a.coins += 3; burst(a, G.HERO_X, G.GROUND - 80, '🪙', 6); }
  a.sx += 220 * dt;
}

function advJump() {
  if (adv && adv.phase === 'run' && adv.hero.y >= G.GROUND) adv.hero.vy = -G.JUMP;
}
function hitBlock(o) {
  adv.hero.vy = 260;
  o.hit = true;
  askAdv(o);
  speak(o.q.it);
}
function askAdv(o) {
  adv.cur = o;
  adv.phase = 'ask';
  renderAdvUI();
}

function advAnswer(i) {
  const a = adv;
  if (!a || a.phase !== 'ask' || !a.cur || a.cur.type === 'friend') return;
  const q = a.cur.q;
  const ok = (a.cur.type === 'block' ? q.choices[i] === q.it.text : q.choices[i] === q.ch);
  recordQuiz(q.it.id, ok);
  finishAdv(ok, false);
}

function advChip(i) {
  const a = adv;
  if (!a || a.phase !== 'ask' || !a.cur || a.cur.type !== 'friend') return;
  const q = a.cur.q, chip = q.chips[i];
  if (chip.used) return;
  if (chip.w === q.words[q.next]) {
    chip.used = true;
    q.next++;
    if (q.next === q.words.length) { recordQuiz(q.it.id, !q.pen); finishAdv(!q.pen, true); }
    else { speak({ stage: 4, text: plain(chip.w) }); renderAdvUI(); }
  } else {
    if (!q.pen) { q.pen = true; a.hearts--; a.wrong++; }  // 문장 하나에 하트는 한 번만 깎는다
    renderAdvUI();
    toast('앗! 다시 생각해 봐요 🤔');
  }
}

function finishAdv(ok, paid) {
  const a = adv, o = a.cur;
  if (ok) { a.coins += 5; burst(a, G.HERO_X + 40, G.GROUND - 100, '⭐', 14); }
  else if (!paid) { a.hearts--; a.wrong++; }
  o.done = true;
  if (o.type === 'bridge') o.built = true;     // 틀려도 다리는 놓인다 (정답은 알려 주고 이 단어는 다음에 또 나온다)
  if (o.type === 'friend') o.freed = true;
  a.fb = { ok, o };
  a.phase = 'result';
  speak(o.q.it);
  renderAdvUI();
  const tk = ++a.tk;
  setTimeout(() => {
    if (adv !== a || a.tk !== tk) return;
    if (a.hearts <= 0) return endAdv(false);
    a.phase = 'run'; a.cur = null; a.fb = null;
    renderAdvUI();
  }, ok ? 1500 : 2800);
}

function endAdv(clear) {
  const a = adv;
  a.phase = clear ? 'clear' : 'over';
  a.stars = clear ? (a.wrong === 0 ? 3 : a.wrong === 1 ? 2 : 1) : 0;
  if (clear && a.stars > (state.adv.stars[a.c.key] || 0)) { state.adv.stars[a.c.key] = a.stars; saveState(); }
  renderAdvUI();
  if (clear) { burst(a, G.HERO_X, G.GROUND - 100, '🎉', 12); speak({ stage: 5, text: '참 잘했어요!' }); }
}

function renderAdvUI() {
  const a = adv, hud = $('advHud'), box = $('advPanel');
  if (!a || !hud || !box) return;
  const done = a.objs.filter(o => o.q && o.done).length;
  hud.innerHTML = `<span class="g-hearts" aria-label="하트 ${a.hearts}개">${'❤️'.repeat(Math.max(0, a.hearts))}${'🤍'.repeat(ADV_HEARTS - Math.max(0, a.hearts))}</span>
    <span class="g-pill">🪙 ${a.coins}</span><span class="g-pill">${done} / ${a.total}</span><span class="g-pill">${a.c.icon} ${esc(a.c.name)}</span>`;
  const cur = a.cur, q = cur && cur.q;
  let html = '';
  if (a.phase === 'ready') html = `<div class="adv-card"><h3>${a.c.icon} ${esc(a.c.name)}</h3><p class="panel-note">${esc(a.c.desc)}</p>
    <ol class="g-how"><li>📦 블록 아래에서 <b>점프</b>해서 머리로 쳐요 → <b>소리</b>를 듣고 알맞은 <b>단어</b>를 골라요</li>
    <li>🌊 끊어진 다리 → <b>빠진 글자</b>를 찾아 다리를 놓아요</li>
    <li>${a.c.friend} 갇힌 친구 → <b>단어 카드</b>를 순서대로 눌러 <b>문장</b>을 읽으면 구해 줘요</li>
    <li>❤️ 하트 ${ADV_HEARTS}개 · 별 3개를 모아 보세요</li></ol>
    <button class="btn big go" data-act="r2Start">출발! ▶</button></div>`;
  if (a.phase === 'ask' && cur.type === 'block') html = `<div class="adv-card"><p class="g-tag">📦 소리를 듣고 읽어요</p>
    <button class="btn" data-act="r2Replay">🔊 다시 듣기</button>
    <div class="r2-choices">${q.choices.map((w, i) => `<button class="r2-choice" data-act="r2Ans" data-i="${i}">${esc(w)}<small>${i + 1}</small></button>`).join('')}</div></div>`;
  if (a.phase === 'ask' && cur.type === 'bridge') html = `<div class="adv-card"><p class="g-tag">🌊 빠진 글자를 찾아 다리를 놓아요</p>
    <div class="g-big">${q.it.example[1]}</div>
    <div class="r2-word">${q.chars.map((c, i) => i === q.idx ? '<span class="blank">?</span>' : esc(c)).join('')}</div>
    <button class="btn" data-act="r2Replay">🔊 소리 듣기</button>
    <div class="r2-choices">${q.choices.map((c, i) => `<button class="r2-choice" data-act="r2Ans" data-i="${i}">${esc(c)}<small>${i + 1}</small></button>`).join('')}</div></div>`;
  if (a.phase === 'ask' && cur.type === 'friend') html = `<div class="adv-card"><p class="g-tag">${a.c.friend} 단어 카드를 순서대로 눌러 문장을 읽어요</p>
    <div class="g-big">${q.it.example[1]}</div>
    <div class="r2-built">${q.words.slice(0, q.next).map(w => `<span class="r2-slot on">${esc(w)}</span>`).join('')}${q.next < q.words.length ? '<span class="r2-slot">?</span>' : ''}</div>
    <div class="r2-choices">${q.chips.map((ch, i) => `<button class="r2-chip" data-act="r2Chip" data-i="${i}" ${ch.used ? 'disabled' : ''}>${esc(ch.w)}</button>`).join('')}</div></div>`;
  if (a.phase === 'result') {
    const f = a.fb;
    html = `<div class="adv-card ${f.ok ? 'ok' : 'ng'}"><div class="g-big">${f.ok ? '🎉' : '💔'}</div>
      <h3>${f.ok ? '정답이에요!' : '앗, 아쉬워요!'}</h3>
      <p class="g-answer"><span>${f.o.q.it.example[1]}</span><b>${esc(f.o.q.it.text)}</b></p>
      ${f.ok ? '' : '<p class="g-tip">이 글은 다음에 다시 나와요 🔁</p>'}</div>`;
  }
  if (a.phase === 'clear' || a.phase === 'over') {
    const next = ADV_COURSES[ADV_COURSES.findIndex(c => c.key === a.c.key) + 1];
    html = `<div class="adv-card"><div class="g-big">${a.phase === 'clear' ? '🏆' : '😢'}</div>
      <h3>${a.phase === 'clear' ? '코스 완주!' : '하트를 다 썼어요'}</h3>
      <p class="g-stars">${'⭐'.repeat(a.stars)}${'☆'.repeat(3 - a.stars)}</p>
      <p class="g-tip">모은 코인 <b>${a.coins}</b> · 틀린 문제 <b>${a.wrong}</b></p>
      <button class="btn big go" data-act="r2Start">다시 하기 ↻</button>
      ${a.phase === 'clear' && next ? `<button class="btn big" data-act="r2Next" style="${tone(4)}">다음 코스 ▶</button>` : ''}</div>`;
  }
  box.innerHTML = html;
  // 문제·결과 카드는 화면 안으로, 달리는 중에는 게임 화면이 보이게 (태블릿에서 스크롤하지 않아도 되도록)
  const target = a.phase === 'run' ? $('advCanvas') : box;
  if (target && a.phase !== 'ready') target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function drawAdv(c) {
  const a = adv, W = G.W, H = G.H, sx = a.sx, k = a.c;
  const sky = c.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, k.sky[0]); sky.addColorStop(1, k.sky[1]);
  c.fillStyle = sky; c.fillRect(0, 0, W, H);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = `46px ${EMOJI_FONT}`; c.globalAlpha = .85;
  for (let i = 0; i < 6; i++) c.fillText('☁️', ((i * 230 - sx * .25) % 1380 + 1380) % 1380 - 100, 56 + (i % 3) * 38);
  c.globalAlpha = 1; c.font = `44px ${EMOJI_FONT}`;
  for (let i = 0; i < 8; i++) c.fillText(k.deco[i % k.deco.length], ((i * 170 - sx * .5) % 1360 + 1360) % 1360 - 80, G.GROUND - 22);
  c.fillStyle = k.ground; c.fillRect(0, G.GROUND, W, H - G.GROUND);
  c.fillStyle = 'rgba(45,50,80,.12)'; c.fillRect(0, G.GROUND, W, 6);
  for (let i = 0; i < 12; i++) { // 징검돌 무늬
    const x = ((i * 120 - sx) % 1440 + 1440) % 1440 - 60;
    c.beginPath(); c.ellipse(x, G.GROUND + 40, 34, 12, 0, 0, 7); c.fillStyle = 'rgba(45,50,80,.1)'; c.fill();
  }
  a.objs.forEach(o => {
    const px = o.x - sx;
    if (px < -160 || px > W + 160) return;
    if (o.type === 'bridge') {
      if (!o.built) {
        c.fillStyle = '#5cc4ff'; c.fillRect(px - 75, G.GROUND, 150, H - G.GROUND);
        c.font = `28px ${EMOJI_FONT}`; c.fillText('🌊', px - 35, G.GROUND + 34); c.fillText('🌊', px + 35, G.GROUND + 34);
      } else {
        c.fillStyle = '#b9824a'; c.fillRect(px - 75, G.GROUND - 4, 150, 16);
        c.fillStyle = 'rgba(0,0,0,.18)'; for (let i = 1; i < 6; i++) c.fillRect(px - 75 + i * 25, G.GROUND - 4, 3, 16);
      }
    }
    if (o.type === 'block') {
      const y = G.GROUND - 175;
      c.fillStyle = o.hit ? '#c9a46a' : '#ffc233'; c.strokeStyle = '#2d3250'; c.lineWidth = 4;
      c.beginPath(); c.roundRect(px - 32, y - 32, 64, 64, 12); c.fill(); c.stroke();
      c.fillStyle = '#2d3250'; c.font = `36px "Jua", ${EMOJI_FONT}`; c.fillText(o.hit ? '✓' : '?', px, y + 2);
    }
    if (o.type === 'coin' && !o.done) {
      c.font = `34px ${EMOJI_FONT}`;
      [-44, 0, 44].forEach((d, i) => c.fillText('🪙', px + d, G.GROUND - 46 - Math.abs(Math.sin(a.t * 4 + i)) * 10));
    }
    if (o.type === 'friend') {
      c.font = `56px ${EMOJI_FONT}`;
      c.fillText(k.friend, px, G.GROUND - 34 - (o.freed ? Math.abs(Math.sin(a.t * 6)) * 24 : 0));
      if (!o.freed) { c.strokeStyle = '#2d3250'; c.lineWidth = 4; c.strokeRect(px - 40, G.GROUND - 76, 80, 76); for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(px + i * 24, G.GROUND - 76); c.lineTo(px + i * 24, G.GROUND); c.stroke(); } }
      else { c.font = `30px ${EMOJI_FONT}`; c.fillText('❤️', px + 36, G.GROUND - 84); }
    }
    if (o.type === 'flag') { c.font = `64px ${EMOJI_FONT}`; c.fillText('🏁', px, G.GROUND - 40); }
  });
  const h = a.hero, bob = a.phase === 'run' && !a.waiting && h.y >= G.GROUND ? Math.abs(Math.sin(a.t * 12)) * 6 : 0;
  c.font = `58px ${EMOJI_FONT}`; c.fillText('🐥', G.HERO_X, h.y - 32 - bob);
  if (a.waiting && Math.floor(a.t * 3) % 2 === 0) { c.font = `26px "Jua", ${EMOJI_FONT}`; c.fillStyle = '#2d3250'; c.fillText('⬆️ 점프!', G.HERO_X, h.y - 96); }
  c.font = `28px ${EMOJI_FONT}`;
  a.fx.forEach(p => { c.globalAlpha = Math.max(0, p.life); c.fillText(p.s, p.x, p.y); });
  c.globalAlpha = 1;
}

/* ---------- 이벤트: Rev.1의 클릭 처리에서 'r2'로 시작하는 동작을 여기로 보낸다 ---------- */
function r2Click(b) {
  const act = b.dataset.act, d = b.dataset;
  if (act === 'r2More') { const t = document.querySelector('.tools'); b.setAttribute('aria-expanded', t.classList.toggle('open')); }
  if (act === 'r2Book') { bk.id = d.id; bk.page = 0; renderView(); }
  if (act === 'r2BookList') { stopSpeak(); bk.id = null; renderView(); }
  if (act === 'r2Mode') { bk.mode = d.m; renderView(); }
  if (act === 'r2Page') { stopSpeak(); bk.page += Number(d.d); renderView(); }
  if (act === 'r2Word') speak({ stage: 4, text: plain(b.textContent) });
  if (act === 'r2Along') {
    const words = fillName(bookOf(bk.id).pages[bk.page].s).split(' ');
    if (bk.mode === 'together') readAlong(words, 0); else speak({ stage: 5, text: words.join(' ') });
  }
  if (act === 'r2Done') bookDone();
  if (act === 'r2Course') { advCourse = d.k; adv = null; renderView(); }
  if (act === 'r2Start') { adv = newAdv(advCourse); adv.phase = 'run'; renderAdvUI(); }
  if (act === 'r2Next') { advCourse = ADV_COURSES[ADV_COURSES.findIndex(c => c.key === advCourse) + 1].key; adv = null; renderView(); }
  if (act === 'r2Jump') advJump();
  if (act === 'r2Ans') advAnswer(Number(d.i));
  if (act === 'r2Chip') advChip(Number(d.i));
  if (act === 'r2Replay' && adv && adv.cur) speak(adv.cur.q.it);
}
document.addEventListener('pointerdown', e => { if (e.target.id === 'advCanvas') advJump(); });
document.addEventListener('keydown', e => {
  if (!adv || state.ui.view !== 'adv' || !$('dialog').hidden || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.code === 'Space' || e.key === 'ArrowUp') { e.preventDefault(); advJump(); }
  if (adv.phase === 'ask' && /^[1-3]$/.test(e.key)) advAnswer(Number(e.key) - 1);
});
</script>
